<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation - Hôtels El Mouradi</title>
  <link rel="stylesheet" href="mesStyles.css">
  <style>
    body {
      padding: 15px;
      box-sizing: border-box;
      font-size: 14px;
    }
    form {
      max-width: 650px;
      margin: 0 auto;
    }
    .form-group {
      margin-bottom: 8px;
    }
    input[type="text"], input[type="tel"], input[type="date"], select {
      padding: 4px 8px;
      border: 1px solid #7a9ec7;
      border-radius: 4px;
      font-size: 14px;
    }
    select {
      min-width: 200px;
    }
  </style>
</head>
<body>
  <!-- Question 4-a : Formulaire de recherche et réservation -->
  <form action="#" method="post">
    <fieldset>
      <legend>Rechercher un Hôtel</legend>

      <div class="form-group">
        <label for="destination">Destination :</label>
        <select id="destination" name="destination">
          <option value="">Choisir une destination</option>
          <option value="Sousse">Sousse</option>
          <option value="Gammarth">Gammarth</option>
          <option value="Tabarka">Tabarka</option>
        </select>
      </div>

      <fieldset>
        <legend>Date entre</legend>
        <div class="form-group">
          <label for="date1">Date 1 :</label>
          <input type="date" id="date1" name="date1">
          <label for="date2" style="margin-left: 20px;">Date 2 :</label>
          <input type="date" id="date2" name="date2">
        </div>
      </fieldset>

      <fieldset>
        <legend>Client</legend>
        <div class="form-group">
          <label>Type identifiant :</label>
          <input type="radio" id="passeport" name="type_id" value="Passeport" checked>
          <label for="passeport" class="radio-inline">Passeport</label>
          <input type="radio" id="cin" name="type_id" value="Cin">
          <label for="cin" class="radio-inline">Cin</label>
        </div>
        <div class="form-group">
          <label for="identifiant">Identifiant :</label>
          <input type="text" id="identifiant" name="identifiant" placeholder="Numéro CIN / Passeport">
        </div>
        <div class="form-group">
          <label for="nom_prenom">Nom et prénom :</label>
          <input type="text" id="nom_prenom" name="nom_prenom" placeholder="Votre nom complet">
        </div>
        <div class="form-group">
          <label for="telephone">Téléphone :</label>
          <input type="tel" id="telephone" name="telephone" placeholder="Numéro de téléphone">
        </div>
      </fieldset>

      <fieldset>
        <legend>Réservation d'une chambre</legend>
        <div class="form-group">
          <label for="chambre">Chambre :</label>
          <select id="chambre" name="chambre">
            <option value="">Choisir une chambre</option>
            <option value="single">chambre single</option>
            <option value="double">chambre double</option>
            <option value="triple">chambre triple</option>
            <option value="quadruple">chambre quadruple</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Services supplémentaires</legend>
        <div class="form-group">
          <input type="checkbox" id="lit_bebe" name="services[]" value="Lit bébé">
          <label for="lit_bebe" class="checkbox-inline">Lit bébé</label>

          <input type="checkbox" id="baby_sitting" name="services[]" value="Baby Sitting">
          <label for="baby_sitting" class="checkbox-inline">Baby Sitting</label>

          <input type="checkbox" id="navette" name="services[]" value="Navette aéroport">
          <label for="navette" class="checkbox-inline">Navette aéroport</label>

          <input type="checkbox" id="lave_linge" name="services[]" value="Lave-linge">
          <label for="lave_linge" class="checkbox-inline">Lave-linge</label>
        </div>
      </fieldset>

      <!-- Conteneur pour les deux boutons aligné à droite -->
      <div class="boutons-container">
        <input type="reset" value="Annuler">
        <input type="submit" value="Chercher">
      </div>

    </fieldset>
  </form>
</body>
</html>
