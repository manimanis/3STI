<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" style="max-width: 100%; height: auto; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Dégradés vifs et modernes -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Fond global et cadre fenêtre -->
  <rect x="5" y="5" width="850" height="510" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Barre de titre fenêtre -->
  <rect x="5" y="5" width="850" height="36" rx="12" fill="#0f172a" />
  <rect x="5" y="24" width="850" height="17" fill="#0f172a" />
  <circle cx="26" cy="23" r="5.5" fill="#ef4444" />
  <circle cx="44" cy="23" r="5.5" fill="#f59e0b" />
  <circle cx="62" cy="23" r="5.5" fill="#10b981" />
  <text x="430" y="27" fill="#f8fafc" font-size="12.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    STRUCTURE SÉMANTIQUE HTML5 — ARCHITECTURE TYPE DU DOCUMENT
  </text>

  <!-- Zone 1 : <header> (Bleu Royal) -->
  <g transform="translate(20, 48)">
    <rect x="0" y="0" width="820" height="72" rx="8" fill="url(#headerGrad)" stroke="#1e40af" stroke-width="1.5" />
    <rect x="15" y="10" width="88" height="24" rx="12" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.5" />
    <text x="59" y="26" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;header&gt;</text>
    <text x="410" y="44" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
      Entête de la page
    </text>
  </g>

  <!-- Zone 2 : <nav> (Cyan / Turquoise) -->
  <g transform="translate(20, 126)">
    <rect x="0" y="0" width="820" height="46" rx="6" fill="url(#navGrad)" stroke="#0284c7" stroke-width="1.5" />
    <rect x="15" y="11" width="70" height="24" rx="12" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.5" />
    <text x="50" y="27" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;nav&gt;</text>
    <g transform="translate(270, 8)">
      <rect x="0" y="0" width="90" height="30" rx="15" fill="#ffffff" />
      <text x="45" y="20" fill="#0284c7" font-size="12" font-weight="bold" text-anchor="middle">Accueil</text>

      <rect x="105" y="0" width="100" height="30" rx="15" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.4" />
      <text x="155" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Actualités</text>

      <rect x="220" y="0" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.4" />
      <text x="265" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Contact</text>
    </g>
  </g>

  <!-- Conteneur corps (<main> + <aside>) -->
  <g transform="translate(20, 178)">
    <!-- Zone 3 : <main> -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="565" height="265" rx="8" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
      <rect x="12" y="10" width="75" height="24" rx="12" fill="#0284c7" />
      <text x="49.5" y="26" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;main&gt;</text>
      <text x="100" y="27" fill="#0284c7" font-size="16" font-weight="bold">Contenu principal</text>

      <!-- Sous-zone : <section> -->
      <g transform="translate(12, 42)">
        <rect x="0" y="0" width="541" height="211" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
        <line x1="0" y1="0" x2="0" y2="211" stroke="#10b981" stroke-width="5" />
        <rect x="15" y="10" width="85" height="22" rx="11" fill="#10b981" />
        <text x="57.5" y="25" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">&lt;section&gt;</text>
        <text x="112" y="26" fill="#047857" font-size="15" font-weight="bold">Section thématique</text>
        
        <text x="15" y="54" fill="#1e293b" font-size="12.5" font-weight="600">
          Texte explicatif du sujet abordé dans cette section.
        </text>
        <text x="15" y="72" fill="#475569" font-size="11.5">
          Ce bloc central regroupe les articles, illustrations et données clés de la page.
        </text>

        <g transform="translate(15, 88)">
          <rect x="0" y="0" width="245" height="110" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2" />
          <rect x="8" y="8" width="70" height="18" rx="4" fill="#dcfce7" stroke="#86efac" />
          <text x="43" y="21" fill="#15803d" font-size="9.5" font-weight="bold" text-anchor="middle">Article 1</text>
          <text x="12" y="44" fill="#0f172a" font-size="12" font-weight="bold">Présentation HTML5</text>
          <text x="12" y="64" fill="#64748b" font-size="10.5">Structure hiérarchique et</text>
          <text x="12" y="79" fill="#64748b" font-size="10.5">balises de sémantique pure.</text>
          <rect x="12" y="88" width="85" height="16" rx="3" fill="#10b981" />
          <text x="54.5" y="100" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">Lire la suite</text>
        </g>

        <g transform="translate(272, 88)">
          <rect x="0" y="0" width="254" height="110" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2" />
          <rect x="8" y="8" width="70" height="18" rx="4" fill="#dcfce7" stroke="#86efac" />
          <text x="43" y="21" fill="#15803d" font-size="9.5" font-weight="bold" text-anchor="middle">Article 2</text>
          <text x="12" y="44" fill="#0f172a" font-size="12" font-weight="bold">Feuilles de style CSS3</text>
          <text x="12" y="64" fill="#64748b" font-size="10.5">Dispositions modernes et</text>
          <text x="12" y="79" fill="#64748b" font-size="10.5">harmonie des palettes vives.</text>
          <rect x="12" y="88" width="85" height="16" rx="3" fill="#0284c7" />
          <text x="54.5" y="100" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">Découvrir</text>
        </g>
      </g>
    </g>

    <!-- Zone 4 : <aside> -->
    <g transform="translate(578, 0)">
      <rect x="0" y="0" width="242" height="265" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" />
      <rect x="12" y="10" width="70" height="24" rx="12" fill="#f97316" />
      <text x="47" y="26" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;aside&gt;</text>
      <text x="92" y="27" fill="#ea580c" font-size="16" font-weight="bold">En relation</text>
      
      <text x="14" y="52" fill="#9a3412" font-size="11.5" font-weight="600">
        Liens périphériques :
      </text>

      <g transform="translate(12, 64)">
        <rect x="0" y="0" width="218" height="52" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" />
        <text x="12" y="24" fill="#9a3412" font-size="11.5" font-weight="bold">Norme W3C HTML5</text>
        <text x="12" y="40" fill="#7c2d12" font-size="10">Spécifications officielles</text>
      </g>

      <g transform="translate(12, 124)">
        <rect x="0" y="0" width="218" height="52" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" />
        <text x="12" y="24" fill="#9a3412" font-size="11.5" font-weight="bold">Guide des Couleurs</text>
        <text x="12" y="40" fill="#7c2d12" font-size="10">Palettes vives et contrastes</text>
      </g>

      <g transform="translate(12, 184)">
        <rect x="0" y="0" width="218" height="52" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2" />
        <text x="12" y="24" fill="#9a3412" font-size="11.5" font-weight="bold">Conseils ergonomie</text>
        <text x="12" y="40" fill="#7c2d12" font-size="10">Lisibilité et accessibilité</text>
      </g>

      <text x="121" y="252" fill="#c2410c" font-size="10" font-weight="600" text-anchor="middle">
        Plateforme éducative 3STI
      </text>
    </g>
  </g>

  <!-- Zone 5 : <footer> -->
  <g transform="translate(20, 452)">
    <rect x="0" y="0" width="820" height="48" rx="8" fill="url(#footerGrad)" stroke="#6d28d9" stroke-width="1.5" />
    <rect x="15" y="12" width="75" height="24" rx="12" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.5" />
    <text x="52.5" y="28" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;footer&gt;</text>
    <text x="410" y="30" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">
      Pied de page — Tous droits réservés 3STI
    </text>
  </g>
</svg>
