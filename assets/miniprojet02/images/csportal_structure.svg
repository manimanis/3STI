<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 940" width="980" height="940" style="max-width: 100%; height: auto; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Ombre douce generale -->
    <filter id="boxShadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="pillShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2" />
    </filter>

    <!-- Degrades de styles -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1c3b" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0e3e60" />
    </linearGradient>

    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#073b8e" />
      <stop offset="100%" stop-color="#0a2d6c" />
    </linearGradient>

    <linearGradient id="mainBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="btnActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="btnNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Fond global du document (representant le <body>) -->
  <rect x="5" y="5" width="970" height="930" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- En-tete globale du diagramme -->
  <rect x="5" y="5" width="970" height="42" rx="14" fill="#1e293b" />
  <rect x="5" y="30" width="970" height="17" fill="#1e293b" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="46" cy="24" r="6" fill="#f59e0b" />
  <circle cx="64" cy="24" r="6" fill="#10b981" />
  <text x="490" y="28" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    DOCUMENT HTML5 (index.html) — ARCHITECTURE SÉMANTIQUE
  </text>

  <!-- Zone 1 : <header> -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="920" height="92" rx="8" fill="url(#headerGrad)" stroke="#1e3a8a" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Badge de la balise -->
    <rect x="15" y="10" width="165" height="24" rx="12" fill="#3b82f6" filter="url(#pillShadow)" />
    <text x="97" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Zone 1 : &lt;header&gt;</text>
    
    <!-- Contenu du Header -->
    <text x="460" y="34" fill="#a3e635" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">
      &lt;h1&gt; CS Portal &lt;/h1&gt;
    </text>
    <text x="460" y="56" fill="#e0f2fe" font-size="13" font-weight="500" text-anchor="middle">
      &lt;p&gt; Systèmes et technologies de l'informatique &lt;/p&gt;
    </text>
    <text x="460" y="78" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.8">
      &lt;h2&gt; 3e Sciences de l'informatique &lt;/h2&gt;
    </text>
  </g>

  <!-- Zone 2 : <nav> -->
  <g transform="translate(30, 162)">
    <rect x="0" y="0" width="920" height="46" rx="6" fill="url(#navGrad)" stroke="#0c4a6e" stroke-width="1.5" filter="url(#boxShadow)" />
    
    <!-- Badge balise -->
    <rect x="15" y="10" width="135" height="26" rx="13" fill="#0284c7" filter="url(#pillShadow)" />
    <text x="82" y="27" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Zone 2 : &lt;nav&gt;</text>
    
    <!-- Boutons de liens nav a parfaitement proportionnes sans debordement -->
    <g transform="translate(305, 8)">
      <!-- Bouton Lien Actif -->
      <rect x="0" y="0" width="165" height="30" rx="6" fill="url(#btnActive)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="82.5" y="20" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;a.active&gt; ACCUEIL</text>

      <!-- Bouton Lien Secondaire -->
      <rect x="180" y="0" width="135" height="30" rx="6" fill="url(#btnNormal)" />
      <text x="247.5" y="20" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">&lt;a&gt; Inscription</text>
    </g>
  </g>

  <!-- Zone 3 : <main> -->
  <g transform="translate(30, 218)">
    <!-- Conteneur principal <main> -->
    <rect x="0" y="0" width="920" height="605" rx="10" fill="url(#mainBg)" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" />
    
    <!-- Badge <main> -->
    <rect x="15" y="10" width="155" height="26" rx="13" fill="#2563eb" filter="url(#pillShadow)" />
    <text x="92" y="27" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">
      Zone 3 : &lt;main&gt;
    </text>

    <!-- Video dans main -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="880" height="76" rx="8" fill="#021324" stroke="#1e293b" stroke-width="1.5" filter="url(#boxShadow)" />
      <!-- Icone de lecture video -->
      <circle cx="48" cy="38" r="20" fill="#2563eb" fill-opacity="0.9" />
      <polygon points="43,29 58,38 43,47" fill="#ffffff" />
      
      <text x="85" y="32" fill="#ffffff" font-size="14" font-weight="bold">
        &lt;video src="medias/intro.mp4" controls poster="medias/entete.png"&gt;
      </text>
      <text x="85" y="54" fill="#94a3b8" font-size="12">
        Lecteur multimédia vidéo avec contrôles et affiche de couverture
      </text>
      <rect x="765" y="25" width="100" height="26" rx="4" fill="#1e293b" stroke="#334155" />
      <text x="815" y="42" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">⚡ Vidéo Web</text>
    </g>

    <!-- Conteneur central (Section + Aside) avec etiquette nette et sans debordement -->
    <g transform="translate(20, 134)">
      <!-- Cadre delimitant le conteneur -->
      <rect x="0" y="0" width="880" height="458" rx="8" fill="#ffffff" fill-opacity="0.6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
      
      <!-- Etiquette badge integree proprement a l'interieur du conteneur -->
      <rect x="15" y="8" width="340" height="24" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <text x="185" y="24" fill="#334155" font-size="11.5" font-weight="bold" text-anchor="middle">
        Conteneur de contenu : &lt;div class="content-wrapper"&gt;
      </text>

      <!-- Zone 4 : <section> -->
      <g transform="translate(10, 38)">
        <rect x="0" y="0" width="605" height="408" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)" />
        
        <!-- En-tete de la section -->
        <rect x="0" y="0" width="605" height="38" rx="8" fill="#f0f9ff" stroke="#bae6fd" />
        <rect x="0" y="28" width="605" height="10" fill="#f0f9ff" />
        
        <!-- Badge Section -->
        <rect x="10" y="7" width="165" height="24" rx="12" fill="#0284c7" />
        <text x="92" y="23" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">
          Zone 4 : &lt;section&gt;
        </text>

        <!-- Titre h2 de la section -->
        <text x="395" y="24" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">
          &lt;h2&gt; LANGAGE DEVELOPPEMENT WEB &lt;/h2&gt;
        </text>

        <!-- Conteneur des 2 articles -->
        <!-- Article 1 : <figure> + <figcaption> -->
        <g transform="translate(12, 44)">
          <rect x="0" y="0" width="280" height="352" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
          
          <!-- Badge Article 1 -->
          <rect x="8" y="6" width="264" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
          <text x="140" y="21" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">
            Zone 4-1 : &lt;article&gt;
          </text>

          <!-- Bloc <figure> -->
          <g transform="translate(10, 32)">
            <rect x="0" y="0" width="260" height="308" rx="6" fill="#ffffff" stroke="#cbd5e1" />
            <rect x="8" y="6" width="80" height="18" rx="3" fill="#64748b" />
            <text x="48" y="19" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">&lt;figure&gt;</text>

            <!-- 3 Boites d'images logos -->
            <g transform="translate(15, 28)">
              <!-- Logo HTML5 -->
              <rect x="0" y="0" width="68" height="84" rx="5" fill="#fff7ed" stroke="#fdba74" />
              <rect x="14" y="8" width="40" height="42" rx="3" fill="#ea580c" />
              <text x="34" y="34" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
              <text x="34" y="68" fill="#ea580c" font-size="9.5" font-weight="bold" text-anchor="middle">HTML5</text>

              <!-- Logo CSS3 -->
              <rect x="81" y="0" width="68" height="84" rx="5" fill="#eff6ff" stroke="#93c5fd" />
              <rect x="95" y="8" width="40" height="42" rx="3" fill="#0284c7" />
              <text x="115" y="34" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CSS</text>
              <text x="115" y="68" fill="#0284c7" font-size="9.5" font-weight="bold" text-anchor="middle">CSS3</text>

              <!-- Logo JS -->
              <rect x="162" y="0" width="68" height="84" rx="5" fill="#fefce8" stroke="#fde047" />
              <rect x="176" y="8" width="40" height="42" rx="3" fill="#eab308" />
              <text x="196" y="34" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">JS</text>
              <text x="196" y="68" fill="#ca8a04" font-size="9.5" font-weight="bold" text-anchor="middle">JavaScript</text>
            </g>

            <text x="130" y="132" fill="#64748b" font-size="10.5" text-anchor="middle">
              3 logos avec la balise &lt;img&gt;
            </text>

            <!-- Bloc <figcaption> -->
            <g transform="translate(12, 146)">
              <rect x="0" y="0" width="236" height="150" rx="6" fill="#082f49" />
              <rect x="8" y="7" width="95" height="18" rx="3" fill="#0284c7" />
              <text x="55" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">&lt;figcaption&gt;</text>
              <text x="118" y="48" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Légende obligatoire :</text>
              <text x="118" y="70" fill="#e0f2fe" font-size="10.5" text-anchor="middle">« HTML structure la page,</text>
              <text x="118" y="90" fill="#e0f2fe" font-size="10.5" text-anchor="middle">CSS la met en forme et</text>
              <text x="118" y="110" fill="#e0f2fe" font-size="10.5" text-anchor="middle">JavaScript la rend interactive. »</text>
            </g>
          </g>
        </g>

        <!-- Article 2 : <table> COMPLET -->
        <g transform="translate(305, 44)">
          <rect x="0" y="0" width="288" height="352" rx="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" />
          
          <!-- Badge Article 2 -->
          <rect x="8" y="6" width="272" height="22" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
          <text x="144" y="21" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">
            Zone 4-2 : &lt;article&gt;
          </text>

          <!-- Bloc <table> -->
          <g transform="translate(8, 32)">
            <rect x="0" y="0" width="272" height="308" rx="6" fill="#ffffff" stroke="#cbd5e1" />
            
            <!-- Caption -->
            <rect x="8" y="6" width="256" height="24" rx="4" fill="#f1f5f9" />
            <text x="136" y="22" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">
              &lt;caption&gt; Rôle des technologies &lt;/caption&gt;
            </text>

            <!-- Table Header <thead> -->
            <g transform="translate(8, 34)">
              <rect x="0" y="0" width="256" height="26" fill="#073b8e" rx="3" />
              <text x="50" y="17" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">&lt;th&gt; Technologie</text>
              <line x1="105" y1="0" x2="105" y2="26" stroke="#3b82f6" />
              <text x="180" y="17" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">&lt;th&gt; Rôle principal</text>
            </g>

            <!-- Table Body <tbody> (3 rows) -->
            <g transform="translate(8, 62)">
              <!-- Row 1 -->
              <rect x="0" y="0" width="256" height="46" fill="#f8fbff" stroke="#e2e8f0" />
              <text x="50" y="27" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">HTML5</text>
              <line x1="105" y1="0" x2="105" y2="46" stroke="#e2e8f0" />
              <text x="180" y="27" fill="#334155" font-size="10" text-anchor="middle">Structurer le contenu</text>

              <!-- Row 2 -->
              <rect x="0" y="46" width="256" height="50" fill="#ffffff" stroke="#e2e8f0" />
              <text x="50" y="76" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">CSS3</text>
              <line x1="105" y1="46" x2="105" y2="96" stroke="#e2e8f0" />
              <text x="180" y="68" fill="#334155" font-size="10" text-anchor="middle">Présenter et disposer</text>
              <text x="180" y="84" fill="#334155" font-size="10" text-anchor="middle">les éléments</text>

              <!-- Row 3 -->
              <rect x="0" y="96" width="256" height="50" fill="#f8fbff" stroke="#e2e8f0" />
              <text x="50" y="126" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">JavaScript</text>
              <line x1="105" y1="96" x2="105" y2="146" stroke="#e2e8f0" />
              <text x="180" y="119" fill="#334155" font-size="10" text-anchor="middle">Rendre la page</text>
              <text x="180" y="135" fill="#334155" font-size="10" text-anchor="middle">interactive</text>
            </g>

            <!-- Table Footer <tfoot> (colspan="2") -->
            <g transform="translate(8, 216)">
              <rect x="0" y="0" width="256" height="48" fill="#e5f8f1" stroke="#a7f3d0" rx="3" />
              <text x="128" y="19" fill="#065f46" font-size="10" font-weight="bold" text-anchor="middle">
                &lt;tfoot&gt; &lt;td colspan="2"&gt;
              </text>
              <text x="128" y="35" fill="#047857" font-size="9.5" text-anchor="middle">
                « Ces technologies coopèrent... »
              </text>
            </g>
          </g>
        </g>
      </g>

      <!-- Zone 5 : <aside> -->
      <g transform="translate(628, 38)">
        <rect x="0" y="0" width="242" height="408" rx="8" fill="#fff9ec" stroke="#f59e0b" stroke-width="2" filter="url(#boxShadow)" />
        
        <!-- En-tete Aside -->
        <rect x="10" y="7" width="145" height="24" rx="12" fill="#d97706" />
        <text x="82" y="23" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">
          Zone 5 : &lt;aside&gt;
        </text>

        <!-- Bloc <details open> -->
        <g transform="translate(12, 38)">
          <rect x="0" y="0" width="218" height="356" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" />
          
          <rect x="8" y="6" width="95" height="18" rx="3" fill="#b45309" />
          <text x="55" y="19" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">&lt;details open&gt;</text>

          <!-- <summary> -->
          <g transform="translate(10, 28)">
            <rect x="0" y="0" width="198" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" />
            <path d="M 12 13 L 18 19 L 12 25 Z" fill="#b45309" />
            <text x="26" y="21" fill="#92400e" font-size="11" font-weight="bold">
              &lt;summary&gt; Découvrir...
            </text>
          </g>

          <!-- Paragraphe <p> -->
          <g transform="translate(10, 66)">
            <rect x="0" y="0" width="198" height="74" rx="4" fill="#fffbeb" />
            <text x="10" y="16" fill="#78350f" font-size="10" font-weight="bold">&lt;p&gt;</text>
            <text x="10" y="31" fill="#451a03" font-size="10.5">CS Portal est une</text>
            <text x="10" y="47" fill="#451a03" font-size="10.5">plateforme éducative</text>
            <text x="10" y="63" fill="#451a03" font-size="10.5">pour la 3e Informatique.</text>
          </g>

          <!-- Logo CS-PORTAL -->
          <g transform="translate(10, 146)">
            <rect x="0" y="0" width="198" height="196" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
            <rect x="8" y="7" width="145" height="18" rx="3" fill="#0284c7" />
            <text x="80" y="20" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">&lt;img src="medias/logo.png"&gt;</text>
            
            <!-- Embleme stylise -->
            <circle cx="99" cy="85" r="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
            <polygon points="99,56 128,71 99,86 70,71" fill="#0369a1" />
            <rect x="85" y="86" width="28" height="23" fill="#0284c7" rx="2" />
            <text x="99" y="148" fill="#0c4a6e" font-size="13" font-weight="900" text-anchor="middle">CS PORTAL</text>
            <text x="99" y="166" fill="#0284c7" font-size="9" font-weight="bold" text-anchor="middle">HIGH SCHOOL CS</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Zone 6 : <footer> -->
  <g transform="translate(30, 834)">
    <rect x="0" y="0" width="920" height="85" rx="8" fill="url(#footerGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#boxShadow)" />
    
    <!-- Badge balise -->
    <rect x="15" y="10" width="155" height="26" rx="13" fill="#0284c7" filter="url(#pillShadow)" />
    <text x="92" y="27" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">
      Zone 6 : &lt;footer&gt;
    </text>

    <!-- Contenu Address & Coordonnees -->
    <g transform="translate(200, 15)">
      <rect x="0" y="0" width="705" height="55" rx="6" fill="#0a2d6c" stroke="#1d4ed8" />
      <rect x="10" y="8" width="85" height="18" rx="3" fill="#3b82f6" />
      <text x="52" y="21" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">&lt;address&gt;</text>

      <text x="110" y="24" fill="#ffffff" font-size="12" font-style="italic">
        &lt;ul&gt; &lt;li&gt; Courriel : &lt;a href="mailto:contact@cs-portal.edunet.tn"&gt;contact@cs-portal.edunet.tn&lt;/a&gt; &lt;/li&gt;
      </text>
      <text x="110" y="44" fill="#ffffff" font-size="12" font-style="italic">
             &lt;li&gt; Téléphone : &lt;a href="tel:+21671000123"&gt;+216 71 000 123&lt;/a&gt; &lt;/li&gt; &lt;/ul&gt;
      </text>
    </g>
  </g>
</svg>
