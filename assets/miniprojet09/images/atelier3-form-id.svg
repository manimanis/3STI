<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 270" width="100%" height="100%" style="background:#ffffff; border-radius:8px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="fidshadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="2" y="2" width="496" height="266" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#fidshadow)"/>
  
  <!-- Header Bar -->
  <rect x="2" y="2" width="496" height="34" rx="8" fill="#f8fafc"/>
  <circle cx="16" cy="18" r="4.5" fill="#ef4444"/>
  <circle cx="28" cy="18" r="4.5" fill="#f59e0b"/>
  <circle cx="40" cy="18" r="4.5" fill="#10b981"/>
  <text x="60" y="22" font-size="11" fill="#64748b">Calculateur de Facture (document.getElementById)</text>

  <!-- Form Content -->
  <g transform="translate(30, 48)">
    <!-- Field 1: Prix HT -->
    <text x="0" y="20" font-size="12.5" font-weight="600" fill="#334155">Prix unitaire HT (DT) :</text>
    <rect x="180" y="4" width="120" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="21" font-family="Consolas, Monaco, monospace" font-size="13" fill="#0f172a">120.00</text>
    <text x="310" y="20" font-family="Consolas, Monaco, monospace" font-size="11" fill="#2563eb">#prixHT</text>

    <!-- Field 2: Quantite -->
    <text x="0" y="52" font-size="12.5" font-weight="600" fill="#334155">Quantit&#233; :</text>
    <rect x="180" y="36" width="120" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="53" font-family="Consolas, Monaco, monospace" font-size="13" fill="#0f172a">2</text>
    <text x="310" y="52" font-family="Consolas, Monaco, monospace" font-size="11" fill="#2563eb">#qte</text>

    <!-- Field 3: TVA Select -->
    <text x="0" y="84" font-size="12.5" font-weight="600" fill="#334155">Taux de TVA :</text>
    <rect x="180" y="68" width="120" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="190" y="85" font-size="12" fill="#0f172a">19 %</text>
    <text x="310" y="84" font-family="Consolas, Monaco, monospace" font-size="11" fill="#2563eb">#tva</text>

    <!-- Calculate Button -->
    <rect x="180" y="102" width="120" height="26" rx="4" fill="#2563eb"/>
    <text x="240" y="119" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Calculer TTC</text>

    <!-- Result Division -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="440" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="12" y="18" font-size="10.5" font-family="Consolas, Monaco, monospace" fill="#166534">Zone r&#233;sultat : document.getElementById(&#34;resultat&#34;).innerHTML</text>
      <text x="12" y="38" font-size="12.5" fill="#1e293b">Total HT : <tspan font-weight="bold">240.00 DT</tspan> | Montant TVA : <tspan font-weight="bold">45.60 DT</tspan></text>
      <text x="12" y="54" font-size="13" font-weight="700" fill="#15803d">&#10140; Montant Total TTC = 285.60 DT</text>
    </g>
  </g>
</svg>