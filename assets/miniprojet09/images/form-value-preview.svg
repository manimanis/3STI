<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="520" height="240" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  </g>

  <!-- Browser Header Bar -->
  <path d="M 10 18 Q 10 10 18 10 L 522 10 Q 530 10 530 18 L 530 46 L 10 46 Z" fill="#f1f3f4" stroke="#dadce0" stroke-width="1"/>
  <line x1="10" y1="46" x2="530" y2="46" stroke="#dadce0" stroke-width="1"/>

  <!-- Window Controls (Red, Yellow, Green dots) -->
  <circle cx="28" cy="28" r="5" fill="#ea4335"/>
  <circle cx="44" cy="28" r="5" fill="#fbbc05"/>
  <circle cx="60" cy="28" r="5" fill="#34a853"/>

  <!-- Tab Title -->
  <g transform="translate(80, 18)">
    <rect width="210" height="22" rx="4" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <!-- Page icon -->
    <path d="M 10 5 L 17 5 L 21 9 L 21 17 L 10 17 Z" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <path d="M 17 5 L 17 9 L 21 9" fill="none" stroke="#5f6368" stroke-width="1"/>
    <text x="27" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#3c4043">Aperçu dans le navigateur</text>
  </g>

  <!-- Form Container matching form CSS -->
  <g transform="translate(110, 65)">
    <rect width="320" height="165" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>

    <!-- Field 1: Prix HT -->
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#495057">Prix Hors Taxe (DT) :</text>
    <rect x="15" y="34" width="290" height="32" rx="4" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <text x="25" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#212529">100</text>

    <!-- Field 2: Prix TTC (calculated) -->
    <text x="15" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#495057">Prix TTC (TVA 19%) :</text>
    <rect x="15" y="100" width="290" height="32" rx="4" fill="#e9ecef" stroke="#ced4da" stroke-width="1"/>
    <text x="25" y="121" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="bold" fill="#0d6efd">119.00 DT</text>
  </g>
</svg>

