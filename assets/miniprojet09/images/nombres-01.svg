<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" style="background:#202124; border-radius:8px; font-family:'Consolas', 'Courier New', monospace;">
  <!-- DevTools Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#2d2f34"/>
  <rect x="0" y="26" width="540" height="8" fill="#2d2f34"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#3c4043" stroke-width="1"/>
  
  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Console Tab Indicator -->
  <rect x="68" y="7" width="80" height="20" rx="3" fill="#3c4043"/>
  <text x="108" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#e8eaed" text-anchor="middle">Console</text>
  <text x="160" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9aa0a6">Éléments</text>

  <!-- Warning indicator -->
  <rect x="220" y="8" width="65" height="18" rx="9" fill="#594400"/>
  <circle cx="230" cy="17" r="4" fill="#fbbc04"/>
  <text x="240" y="21" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#fbbc04">1 warning</text>

  <text x="520" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#80868b" text-anchor="end">DevTools (F12)</text>

  <!-- Test context box -->
  <g transform="translate(15, 48)">
    <rect width="510" height="48" rx="5" fill="#2d2f34" stroke="#3c4043"/>
    <text x="14" y="20" font-size="11.5" fill="#8ab4f8">let note1 = &quot;14.5&quot;;  <tspan fill="#80868b">// isNaN(&quot;14.5&quot;) &#8594; false</tspan></text>
    <text x="14" y="38" font-size="11.5" fill="#f28b82">let note2 = &quot;abc&quot;;   <tspan fill="#fbbc04">// isNaN(&quot;abc&quot;) &#8594; true (non numérique !)</tspan></text>
  </g>

  <!-- Warning Output Row in Console -->
  <rect x="0" y="108" width="540" height="54" fill="#332a00" stroke="#665000" stroke-width="1"/>
  <g transform="translate(15, 124)">
    <polygon points="6,3 12,13 0,13" fill="#fbbc04"/>
    <text x="6" y="12" font-size="8" font-weight="bold" fill="#202124" text-anchor="middle">!</text>
    <text x="20" y="11" font-size="11.5" font-weight="bold" fill="#fde293">
      Erreur : Veuillez saisir des notes numériques valides !
    </text>
    <text x="510" y="11" font-size="10" fill="#9aa0a6" text-anchor="end">script.js:5</text>
  </g>

  <!-- Alternative Case if Valid -->
  <g transform="translate(15, 175)">
    <rect width="510" height="60" rx="5" fill="#1b2e22" stroke="#235c36"/>
    <text x="14" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#86efac">
      ✓ Cas nominal (si note2 = &quot;16.5&quot;) :
    </text>
    <text x="14" y="44" font-size="12" fill="#e8eaed">
      &gt; Moyenne = <tspan fill="#68d391" font-weight="bold">15.5</tspan>  <tspan fill="#80868b" font-size="10">(calculé par (14.5 + 16.5) / 2)</tspan>
    </text>
    <text x="495" y="44" font-size="10" fill="#80868b" text-anchor="end">script.js:9</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="15" y="248" width="510" height="38" rx="4" fill="#2d3748" stroke="#4a5568"/>
  <text x="270" y="266" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
    💡 Toujours contrôler la validité avec <tspan fill="#fde293" font-weight="bold">isNaN()</tspan> avant conversion numérique.
  </text>
  <text x="270" y="279" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
    <tspan fill="#93c5fd">parseFloat()</tspan> ou <tspan fill="#93c5fd">Number()</tspan> convertit la chaîne issue du champ formulaire.
  </text>
</svg>