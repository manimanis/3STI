<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" width="100%" height="100%">
  <defs>
    <filter id="fshadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="2" y="2" width="436" height="266" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#fshadow)" />

  <!-- Window Header -->
  <rect x="2" y="2" width="436" height="36" rx="8" fill="#f8fafc" />
  <path d="M 2 38 L 438 38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="18" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="20" r="4.5" fill="#f59e0b" />
  <circle cx="46" cy="20" r="4.5" fill="#10b981" />

  <!-- Address Bar -->
  <rect x="65" y="10" width="355" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="75" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">http://127.0.0.1:5500/javascript06.html</text>

  <!-- Form Content Area -->
  <g transform="translate(30, 60)">
    <!-- Field a -->
    <text x="0" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">a</text>
    <rect x="80" y="4" width="130" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="92" y="23" font-family="Consolas, Monaco, monospace" font-size="14" fill="#0f172a">9</text>
    <!-- Stepper buttons simulated -->
    <path d="M 196 14 L 202 8 L 208 14 Z" fill="#64748b" />
    <path d="M 196 22 L 202 28 L 208 22 Z" fill="#64748b" />

    <!-- Field b -->
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">b</text>
    <rect x="80" y="48" width="130" height="28" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="92" y="67" font-family="Consolas, Monaco, monospace" font-size="14" fill="#0f172a">16</text>
    <!-- Stepper buttons simulated -->
    <path d="M 196 58 L 202 52 L 208 58 Z" fill="#64748b" />
    <path d="M 196 66 L 202 72 L 208 66 Z" fill="#64748b" />

    <!-- Field res (disabled) -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e293b">a + b =</text>
    <rect x="80" y="92" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="92" y="111" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="700" fill="#0f172a">25</text>
    <!-- Lock icon on disabled field -->
    <path d="M 198 104 L 198 101 C 198 99 204 99 204 101 L 204 104" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="196" y="104" width="10" height="8" rx="1.5" fill="#94a3b8" />

    <!-- Calculation Explanation Badge -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="380" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="14" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#166534">
        &#10003; Calcul dynamique : res.value = 9 + 16 = 25
      </text>
    </g>
  </g>
</svg>
