<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%" style="background:#f1f3f4; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-ter" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Dialog Case 1: Différents (v1 != v2) -->
  <g transform="translate(15, 15)" filter="url(#shadow-ter)">
    <rect width="245" height="150" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <circle cx="16" cy="18" r="6" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <text x="28" y="22" font-size="11" font-weight="600" fill="#202124">127.0.0.1 indique</text>
    
    <!-- Badge -->
    <rect x="16" y="38" width="95" height="18" rx="3" fill="#fee2e2"/>
    <text x="63" y="51" font-size="9.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Cas 1 : (v1 != v2)</text>

    <!-- Message Text -->
    <text x="16" y="84" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#1e293b">
      0 == 1 ? Différents
    </text>

    <!-- OK Button -->
    <rect x="175" y="112" width="54" height="24" rx="3" fill="#1a73e8"/>
    <text x="202" y="128" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
  </g>

  <!-- Dialog Case 2: Egaux (v1 == v2) -->
  <g transform="translate(280, 15)" filter="url(#shadow-ter)">
    <rect width="245" height="150" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <circle cx="16" cy="18" r="6" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <text x="28" y="22" font-size="11" font-weight="600" fill="#202124">127.0.0.1 indique</text>
    
    <!-- Badge -->
    <rect x="16" y="38" width="95" height="18" rx="3" fill="#dcfce7"/>
    <text x="63" y="51" font-size="9.5" font-weight="bold" fill="#166534" text-anchor="middle">Cas 2 : (v1 == v2)</text>

    <!-- Message Text -->
    <text x="16" y="84" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#1e293b">
      1 == 1 ? Egaux
    </text>

    <!-- OK Button -->
    <rect x="175" y="112" width="54" height="24" rx="3" fill="#1a73e8"/>
    <text x="202" y="128" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
  </g>

  <!-- Explanatory Banner -->
  <rect x="15" y="185" width="510" height="34" rx="4" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="270" y="206" font-size="11.5" fill="#3730a3" text-anchor="middle" font-weight="600">
    💡 Opérateur ternaire : <tspan font-family="'Consolas', monospace" font-size="11">(v1 == v2) ? &quot;Egaux&quot; : &quot;Différents&quot;</tspan>
  </text>
</svg>