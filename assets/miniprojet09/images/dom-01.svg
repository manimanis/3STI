<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="100%" height="100%">
  <defs>
    <filter id="d1shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="2" y="2" width="436" height="276" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#d1shadow)" />

  <!-- Window Header -->
  <rect x="2" y="2" width="436" height="36" rx="8" fill="#f8fafc" />
  <path d="M 2 38 L 438 38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="18" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="20" r="4.5" fill="#f59e0b" />
  <circle cx="46" cy="20" r="4.5" fill="#10b981" />

  <!-- Address Bar -->
  <rect x="65" y="10" width="355" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="75" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">http://127.0.0.1:5500/javascript05.html</text>

  <!-- Content Area -->
  <g transform="translate(25, 55)">
    <!-- Form Box -->
    <rect x="0" y="0" width="390" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Nom & Prenom -->
    <text x="15" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Nom &#38; Pr&#233;nom</text>
    <rect x="140" y="10" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="148" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">Yassine</text>

    <!-- Date de naissance -->
    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Date de naissance</text>
    <rect x="140" y="42" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="148" y="59" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">2022-10-08</text>

    <!-- Button Confirmer -->
    <rect x="140" y="76" width="90" height="26" rx="4" fill="#2563eb" />
    <text x="185" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Confirmer</text>

    <!-- document.writeln output area -->
    <g transform="translate(0, 135)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1" />
      <text x="15" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Bonjour Yassine</text>
      <text x="15" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Vous &#234;tes n&#233; le 2022-10-08</text>
    </g>
  </g>
</svg>