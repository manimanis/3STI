<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%" style="background:#ffffff; border-radius:10px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow3steps" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08" />
    </filter>
    <marker id="flow-arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d6efd"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="940" height="42" fill="#f8f9fa" rx="10" />
  <rect x="0" y="34" width="940" height="8" fill="#f8f9fa" />
  <line x1="0" y1="42" x2="940" y2="42" stroke="#dee2e6" stroke-width="1" />
  <circle cx="22" cy="21" r="5.5" fill="#dc3545" />
  <circle cx="38" cy="21" r="5.5" fill="#ffc107" />
  <circle cx="54" cy="21" r="5.5" fill="#198754" />
  <text x="470" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">Les 3 étapes clés de manipulation du DOM avec JavaScript</text>

  <!-- ==================== ÉTAPE 1 : CIBLER / SÉLECTIONNER ==================== -->
  <g transform="translate(20, 58)" filter="url(#shadow3steps)">
    <rect width="275" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="275" height="36" rx="8" fill="#e0f2fe" />
    <rect y="28" width="275" height="8" fill="#e0f2fe" />
    <circle cx="24" cy="18" r="11" fill="#0284c7" />
    <text x="24" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
    <text x="44" y="23" font-size="13" font-weight="bold" fill="#0369a1">Cibler / Sélectionner</text>

    <text x="14" y="58" font-size="11.5" fill="#475569">Trouver l'élément dans l'arbre du DOM :</text>

    <!-- Box 1: getElementById -->
    <rect x="12" y="72" width="251" height="64" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
    <text x="18" y="93" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#0369a1">document.getElementById(&quot;id&quot;)</text>
    <text x="18" y="112" font-size="10.5" fill="#0f766e">&#8594; Retourne <tspan font-weight="bold">l'unique élément</tspan> portant cet id</text>
    <text x="18" y="126" font-size="10" fill="#64748b">Ex : const t = document.getElementById(&quot;titre&quot;);</text>

    <!-- Box 2: getElementsByName -->
    <rect x="12" y="148" width="251" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="18" y="169" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#0369a1">document.getElementsByName(&quot;nom&quot;)</text>
    <text x="18" y="188" font-size="10.5" fill="#0f766e">&#8594; Retourne une <tspan font-weight="bold">collection</tspan> d'éléments</text>
    <text x="18" y="203" font-size="10" fill="#64748b">Ex : boutons radio, cases à cocher ([0], [1]...)</text>

    <!-- Bottom summary label -->
    <rect x="12" y="222" width="251" height="17" rx="3" fill="#e0f2fe" />
    <text x="137" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">Point d'entrée obligatoire avant toute action</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <path d="M 300 175 L 322 175" stroke="#0d6efd" stroke-width="3" marker-end="url(#flow-arrow-blue)" />
  </g>

  <!-- ==================== ÉTAPE 2 : MODIFIER LE CONTENU ==================== -->
  <g transform="translate(328, 58)" filter="url(#shadow3steps)">
    <rect width="275" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="275" height="36" rx="8" fill="#dcfce7" />
    <rect y="28" width="275" height="8" fill="#dcfce7" />
    <circle cx="24" cy="18" r="11" fill="#16a34a" />
    <text x="24" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
    <text x="44" y="23" font-size="13" font-weight="bold" fill="#15803d">Modifier le contenu</text>

    <text x="14" y="58" font-size="11.5" fill="#475569">Changer les textes ou valeurs internes :</text>

    <!-- Box 1: innerHTML -->
    <rect x="12" y="72" width="251" height="68" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
    <text x="18" y="93" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#15803d">elem.innerHTML = &quot;&lt;b&gt;Texte HTML&lt;/b&gt;&quot;;</text>
    <text x="18" y="112" font-size="10.5" fill="#0f766e">&#8594; Conteneurs : &lt;div&gt;, &lt;p&gt;, &lt;span&gt;, &lt;h1&gt;...</text>
    <text x="18" y="127" font-size="10" fill="#64748b">Modifie ou insère du texte et des balises</text>

    <!-- Box 2: value -->
    <rect x="12" y="148" width="251" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="18" y="169" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#15803d">elem.value = &quot;Nouvelle valeur&quot;;</text>
    <text x="18" y="188" font-size="10.5" fill="#0f766e">&#8594; Champs de formulaires : &lt;input&gt;, &lt;select&gt;...</text>
    <text x="18" y="203" font-size="10" fill="#64748b">Permet de lire ou affecter la saisie</text>

    <!-- Bottom summary label -->
    <rect x="12" y="222" width="251" height="17" rx="3" fill="#dcfce7" />
    <text x="137" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Mise à jour dynamique de l'affichage</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <path d="M 608 175 L 630 175" stroke="#0d6efd" stroke-width="3" marker-end="url(#flow-arrow-blue)" />
  </g>

  <!-- ==================== ÉTAPE 3 : STYLES & ATTRIBUTS ==================== -->
  <g transform="translate(636, 58)" filter="url(#shadow3steps)">
    <rect width="284" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect width="284" height="36" rx="8" fill="#fef3c7" />
    <rect y="28" width="284" height="8" fill="#fef3c7" />
    <circle cx="24" cy="18" r="11" fill="#d97706" />
    <text x="24" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
    <text x="44" y="23" font-size="13" font-weight="bold" fill="#b45309">Styles &amp; Attributs</text>

    <text x="14" y="58" font-size="11.5" fill="#475569">Modifier l'aspect visuel et les balises :</text>

    <!-- Box 1: Styles CSS en ligne -->
    <rect x="12" y="72" width="260" height="68" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
    <text x="18" y="93" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#b45309">elem.style.color = &quot;red&quot;;</text>
    <text x="18" y="112" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#b45309">elem.style.backgroundColor = &quot;#ff0&quot;;</text>
    <text x="18" y="128" font-size="10" fill="#64748b">&#8594; Propriétés de style CSS en camelCase</text>

    <!-- Box 2: Attributs & Classes -->
    <rect x="12" y="148" width="260" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="18" y="169" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#b45309">elem.src = &quot;photo.jpg&quot;;</text>
    <text x="18" y="188" font-family="'Consolas', 'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#b45309">elem.classList.add(&quot;actif&quot;);</text>
    <text x="18" y="203" font-size="10" fill="#64748b">&#8594; Attributs HTML et classes CSS</text>

    <!-- Bottom summary label -->
    <rect x="12" y="222" width="260" height="17" rx="3" fill="#fef3c7" />
    <text x="142" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#b45309">Personnalisation du rendu graphique</text>
  </g>
</svg>