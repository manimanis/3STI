<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background:#ffffff; border-radius:10px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d6efd"/>
    </marker>
  </defs>

  <!-- Background Header / Title Bar -->
  <rect x="0" y="0" width="940" height="44" fill="#f8f9fa" rx="10" />
  <rect x="0" y="35" width="940" height="9" fill="#f8f9fa" />
  <line x1="0" y1="44" x2="940" y2="44" stroke="#dee2e6" stroke-width="1" />
  <circle cx="24" cy="22" r="6" fill="#dc3545" />
  <circle cx="42" cy="22" r="6" fill="#ffc107" />
  <circle cx="60" cy="22" r="6" fill="#198754" />
  <text x="470" y="27" text-anchor="middle" font-size="14" font-weight="bold" fill="#343a40">Représentation arborescente du DOM (Document Object Model)</text>

  <!-- Left Column: Code HTML -->
  <rect x="25" y="60" width="310" height="360" rx="8" fill="#1e1e2f" filter="url(#shadow)" />
  <rect x="25" y="60" width="310" height="32" rx="8" fill="#2b2b40" />
  <rect x="25" y="84" width="310" height="8" fill="#2b2b40" />
  <text x="40" y="81" font-size="12" font-weight="bold" fill="#a0a5c0">Code source HTML</text>

  <g font-family="'Consolas', 'Courier New', monospace" font-size="12" xml:space="preserve">
    <text x="40" y="116" fill="#6c757d">&lt;!DOCTYPE html&gt;</text>
    <text x="40" y="136" fill="#ff7b72">&lt;<tspan fill="#7ee787">html</tspan>&gt;</text>
    
    <text x="55" y="160" fill="#ff7b72">&lt;<tspan fill="#7ee787">head</tspan>&gt;</text>
    <text x="70" y="182" fill="#ff7b72">&lt;<tspan fill="#7ee787">title</tspan>&gt;<tspan fill="#ffffff">Mon Titre</tspan>&lt;/<tspan fill="#7ee787">title</tspan>&gt;</text>
    <text x="55" y="204" fill="#ff7b72">&lt;/<tspan fill="#7ee787">head</tspan>&gt;</text>
    
    <text x="55" y="230" fill="#ff7b72">&lt;<tspan fill="#7ee787">body</tspan>&gt;</text>
    <text x="70" y="254" fill="#ff7b72">&lt;<tspan fill="#7ee787">h1</tspan> <tspan fill="#79c0ff">id</tspan>=<tspan fill="#a5d6ff">&quot;titre&quot;</tspan>&gt;<tspan fill="#ffffff">Bonjour</tspan>&lt;/<tspan fill="#7ee787">h1</tspan>&gt;</text>
    <text x="70" y="280" fill="#ff7b72">&lt;<tspan fill="#7ee787">p</tspan>&gt;<tspan fill="#ffffff">Texte explicatif</tspan>&lt;/<tspan fill="#7ee787">p</tspan>&gt;</text>
    <text x="70" y="306" fill="#ff7b72">&lt;<tspan fill="#7ee787">button</tspan> <tspan fill="#79c0ff">id</tspan>=<tspan fill="#a5d6ff">&quot;btn&quot;</tspan>&gt;<tspan fill="#ffffff">OK</tspan>&lt;/<tspan fill="#7ee787">button</tspan>&gt;</text>
    <text x="55" y="332" fill="#ff7b72">&lt;/<tspan fill="#7ee787">body</tspan>&gt;</text>
    
    <text x="40" y="358" fill="#ff7b72">&lt;/<tspan fill="#7ee787">html</tspan>&gt;</text>
  </g>

  <rect x="35" y="378" width="290" height="30" rx="5" fill="#2b2b40" />
  <text x="180" y="398" text-anchor="middle" font-size="11" fill="#38bdf8">Document textuel statique</text>

  <!-- Central Transition Arrow -->
  <g>
    <path d="M 345 235 L 395 235" stroke="#0d6efd" stroke-width="3" stroke-dasharray="4,3" marker-end="url(#arrow-blue)" />
    <rect x="342" y="190" width="60" height="36" rx="6" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1" />
    <text x="372" y="205" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d6efd">Analyse</text>
    <text x="372" y="218" text-anchor="middle" font-size="9" fill="#084298">(Parsing)</text>
  </g>

  <!-- Right Area: DOM Tree Hierarchy -->
  <rect x="410" y="60" width="505" height="360" rx="8" fill="#f8fafc" stroke="#e2e8f0" filter="url(#shadow)" />
  
  <!-- Tree Connectors -->
  <!-- Document to HTML -->
  <path d="M 662 108 L 662 130" stroke="#94a3b8" stroke-width="2" />
  <!-- HTML to HEAD & BODY -->
  <path d="M 662 162 L 662 175 L 522 175 L 522 195" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M 662 162 L 662 175 L 755 175 L 755 195" stroke="#94a3b8" stroke-width="2" fill="none" />
  
  <!-- HEAD to TITLE -->
  <path d="M 522 227 L 522 250" stroke="#94a3b8" stroke-width="2" />
  <!-- TITLE to Text -->
  <path d="M 522 282 L 522 305" stroke="#198754" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- BODY to H1, P, BUTTON -->
  <path d="M 755 227 L 755 238 L 630 238 L 630 250" stroke="#94a3b8" stroke-width="2" fill="none" />
  <path d="M 755 227 L 755 250" stroke="#94a3b8" stroke-width="2" />
  <path d="M 755 227 L 755 238 L 845 238 L 845 250" stroke="#94a3b8" stroke-width="2" fill="none" />

  <!-- H1 to Attribute & Text -->
  <path d="M 630 282 L 630 305" stroke="#198754" stroke-width="1.5" stroke-dasharray="3,2" />
  <path d="M 610 282 L 585 305" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- P to Text -->
  <path d="M 755 282 L 755 305" stroke="#198754" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- BUTTON to Attribute & Text -->
  <path d="M 845 282 L 845 305" stroke="#198754" stroke-width="1.5" stroke-dasharray="3,2" />
  <path d="M 865 282 L 888 305" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- LEVEL 0: document -->
  <g transform="translate(597, 75)">
    <rect width="130" height="33" rx="16" fill="#6f42c1" />
    <text x="65" y="21" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">document</text>
  </g>

  <!-- LEVEL 1: html -->
  <g transform="translate(607, 130)">
    <rect width="110" height="32" rx="6" fill="#0d6efd" />
    <text x="55" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">&lt;html&gt;</text>
  </g>

  <!-- LEVEL 2: head & body -->
  <g transform="translate(472, 195)">
    <rect width="100" height="32" rx="6" fill="#0d6efd" />
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">&lt;head&gt;</text>
  </g>
  <g transform="translate(705, 195)">
    <rect width="100" height="32" rx="6" fill="#0d6efd" />
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">&lt;body&gt;</text>
  </g>

  <!-- LEVEL 3: title, h1, p, button -->
  <g transform="translate(472, 250)">
    <rect width="100" height="32" rx="6" fill="#0284c7" />
    <text x="50" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">&lt;title&gt;</text>
  </g>

  <g transform="translate(585, 250)">
    <rect width="90" height="32" rx="6" fill="#0284c7" />
    <text x="45" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">&lt;h1&gt;</text>
  </g>

  <g transform="translate(715, 250)">
    <rect width="80" height="32" rx="6" fill="#0284c7" />
    <text x="40" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">&lt;p&gt;</text>
  </g>

  <g transform="translate(805, 250)">
    <rect width="80" height="32" rx="6" fill="#0284c7" />
    <text x="40" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">&lt;button&gt;</text>
  </g>

  <!-- LEVEL 4: Attributes & Texts -->
  <!-- Under title: text -->
  <g transform="translate(462, 305)">
    <rect width="120" height="26" rx="4" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
    <text x="60" y="17" text-anchor="middle" font-size="11" fill="#0f5132">&quot;Mon Titre&quot;</text>
  </g>

  <!-- Under h1: attribute id -->
  <g transform="translate(550, 305)">
    <rect width="70" height="24" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1" />
    <text x="35" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#664d03">id=&quot;titre&quot;</text>
  </g>
  <!-- Under h1: text -->
  <g transform="translate(605, 335)">
    <rect width="75" height="24" rx="4" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
    <text x="37" y="16" text-anchor="middle" font-size="10" fill="#0f5132">&quot;Bonjour&quot;</text>
  </g>
  <path d="M 630 282 L 630 335" stroke="#198754" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Under p: text -->
  <g transform="translate(705, 305)">
    <rect width="100" height="26" rx="4" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
    <text x="50" y="17" text-anchor="middle" font-size="10" fill="#0f5132">&quot;Texte explicatif&quot;</text>
  </g>

  <!-- Under button: text & attribute -->
  <g transform="translate(815, 305)">
    <rect width="55" height="24" rx="4" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
    <text x="27" y="16" text-anchor="middle" font-size="10" fill="#0f5132">&quot;OK&quot;</text>
  </g>
  <g transform="translate(855, 335)">
    <rect width="60" height="24" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1" />
    <text x="30" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#664d03">id=&quot;btn&quot;</text>
  </g>
  <path d="M 865 282 L 885 335" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Bottom Legend -->
  <g transform="translate(435, 385)">
    <rect width="16" height="16" rx="8" fill="#6f42c1" />
    <text x="24" y="13" font-size="11" fill="#334155">Racine (document)</text>

    <rect x="135" y="1" width="14" height="14" rx="3" fill="#0d6efd" />
    <text x="155" y="13" font-size="11" fill="#334155">Nœuds Éléments</text>

    <rect x="260" y="1" width="14" height="14" rx="3" fill="#ffc107" stroke="#d97706" stroke-width="1" />
    <text x="280" y="13" font-size="11" fill="#334155">Attributs</text>

    <rect x="350" y="1" width="14" height="14" rx="3" fill="#d1e7dd" stroke="#198754" stroke-width="1" />
    <text x="370" y="13" font-size="11" fill="#334155">Nœuds Texte</text>
  </g>

  <!-- Footer Banner / Explanatory Note -->
  <rect x="25" y="432" width="890" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="470" y="455" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="600">
    💡 Le DOM est une API orientée objet : chaque balise devient un objet JavaScript modifiable en mémoire vive.
  </text>
</svg>