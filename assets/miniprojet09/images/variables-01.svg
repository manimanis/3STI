<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="100%" height="100%" style="background:#202124; border-radius:8px; font-family:'Consolas', 'Courier New', monospace;">
  <defs>
    <filter id="shadow-v1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- DevTools Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#2d2f34"/>
  <rect x="0" y="26" width="540" height="8" fill="#2d2f34"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#3c4043" stroke-width="1"/>
  
  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Console Tab Indicator -->
  <rect x="68" y="7" width="80" height="20" rx="3" fill="#3c4043"/>
  <text x="108" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#e8eaed" text-anchor="middle">Console</text>
  <text x="160" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9aa0a6">Éléments</text>
  <text x="225" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9aa0a6">Sources</text>

  <text x="520" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#80868b" text-anchor="end">DevTools (F12)</text>

  <!-- Line 1: console.log(x, y) -> undefined undefined -->
  <g transform="translate(15, 52)">
    <path d="M 0 6 L 6 10 L 0 14 Z" fill="#80868b"/>
    <text x="15" y="11" font-size="12" fill="#9aa0a6" font-style="italic">undefined undefined</text>
    <text x="510" y="11" font-size="10" fill="#80868b" text-anchor="end">script.js:7</text>
  </g>
  <line x1="10" y1="74" x2="530" y2="74" stroke="#2d2f34" stroke-width="1"/>

  <!-- Line 2: console.log(nom, age) -> Ahmed 16 -->
  <g transform="translate(15, 94)">
    <path d="M 0 6 L 6 10 L 0 14 Z" fill="#80868b"/>
    <text x="15" y="11" font-size="12" fill="#8ab4f8">&quot;Ahmed&quot; <tspan fill="#ce9178">16</tspan></text>
    <text x="510" y="11" font-size="10" fill="#80868b" text-anchor="end">script.js:8</text>
  </g>
  <line x1="10" y1="116" x2="530" y2="116" stroke="#2d2f34" stroke-width="1"/>

  <!-- Prompt line -->
  <g transform="translate(15, 138)">
    <path d="M 0 5 L 7 9 L 0 13 Z" fill="#1a73e8"/>
    <rect x="14" y="2" width="7" height="13" fill="#e8eaed" opacity="0.8"/>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="10" y="160" width="520" height="30" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="270" y="179" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0aec0" text-anchor="middle">
    💡 x et y non initialisées = <tspan fill="#f6e05e" font-weight="bold">undefined</tspan> | nom et age = <tspan fill="#68d391" font-weight="bold">Ahmed 16</tspan>
  </text>
</svg>