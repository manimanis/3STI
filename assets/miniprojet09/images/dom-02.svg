<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 330" width="100%" height="100%">
  <defs>
    <filter id="d2shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="2" y="2" width="446" height="326" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#d2shadow)" />

  <!-- Window Header -->
  <rect x="2" y="2" width="446" height="36" rx="8" fill="#f8fafc" />
  <path d="M 2 38 L 448 38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="18" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="20" r="4.5" fill="#f59e0b" />
  <circle cx="46" cy="20" r="4.5" fill="#10b981" />

  <!-- Address Bar -->
  <rect x="65" y="10" width="365" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="75" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">http://127.0.0.1:5500/javascript05.html (avec curseur range)</text>

  <!-- Content Area -->
  <g transform="translate(25, 52)">
    <!-- Form Box -->
    <rect x="0" y="0" width="400" height="152" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Nom & Prenom -->
    <text x="15" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Nom &#38; Pr&#233;nom</text>
    <rect x="145" y="10" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="153" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">Yassine</text>

    <!-- Date de naissance -->
    <text x="15" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Date de naissance</text>
    <rect x="145" y="42" width="160" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="153" y="59" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0f172a">2022-10-08</text>

    <!-- Range slider -->
    <text x="15" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#334155">Quantit&#233; (1 &#224; 7)</text>
    <!-- Range track -->
    <rect x="145" y="84" width="160" height="6" rx="3" fill="#cbd5e1" />
    <rect x="145" y="84" width="53" height="6" rx="3" fill="#2563eb" />
    <!-- Range thumb at value 3 (approx 1/3 of track) -->
    <circle cx="198" cy="87" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
    <!-- Value indicator badge -->
    <rect x="315" y="75" width="28" height="24" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" />
    <text x="329" y="92" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">3</text>

    <!-- Button Confirmer -->
    <rect x="145" y="112" width="90" height="26" rx="4" fill="#2563eb" />
    <text x="190" y="129" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Confirmer</text>

    <!-- document.writeln output area -->
    <g transform="translate(0, 168)">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#cbd5e1" stroke-dasharray="3,3" stroke-width="1" />
      <text x="15" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Bonjour Yassine</text>
      <text x="15" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Vous &#234;tes n&#233; le 2022-10-08</text>
      <text x="15" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#166534">Quantit&#233; : 3</text>
    </g>
  </g>
</svg>