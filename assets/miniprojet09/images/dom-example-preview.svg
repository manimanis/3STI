<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="100%" style="background:#ffffff; border-radius:10px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <marker id="arrow-action" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0d6efd"/>
    </marker>
  </defs>

  <!-- Browser Header -->
  <rect x="0" y="0" width="940" height="42" fill="#f1f3f5" rx="10" />
  <rect x="0" y="34" width="940" height="8" fill="#f1f3f5" />
  <line x1="0" y1="42" x2="940" y2="42" stroke="#dee2e6" stroke-width="1" />
  <circle cx="20" cy="21" r="5.5" fill="#e03131" />
  <circle cx="36" cy="21" r="5.5" fill="#f59f00" />
  <circle cx="52" cy="21" r="5.5" fill="#2f9e44" />
  <rect x="75" y="10" width="790" height="22" rx="4" fill="#ffffff" stroke="#ced4da" />
  <text x="470" y="25" text-anchor="middle" font-size="11" fill="#495057">http://localhost/demo-dom.html &#8212; Aperçu dans le navigateur</text>

  <!-- Left: État Initial (Avant manipulation) -->
  <g transform="translate(35, 60)" filter="url(#shadow3)">
    <rect width="390" height="250" rx="8" fill="#ffffff" stroke="#dee2e6" />
    <!-- Badge Status -->
    <rect x="0" y="0" width="390" height="32" rx="8" fill="#f8f9fa" />
    <rect x="0" y="24" width="390" height="8" fill="#f8f9fa" />
    <line x1="0" y1="32" x2="390" y2="32" stroke="#e9ecef" />
    <rect x="15" y="7" width="90" height="18" rx="9" fill="#6c757d" />
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">État initial (HTML)</text>

    <!-- Card Content -->
    <rect x="20" y="50" width="350" height="180" rx="6" fill="#f8f9fa" stroke="#e2e8f0" />
    
    <text x="35" y="80" font-size="15" font-weight="bold" fill="#212529">Message initial</text>
    
    <rect x="35" y="95" width="320" height="60" rx="4" fill="#ffffff" stroke="#ced4da" />
    <text x="48" y="120" font-size="12" fill="#495057">Le contenu n'a pas encore été modifié</text>
    <text x="48" y="138" font-size="12" fill="#495057">par JavaScript.</text>

    <!-- Button -->
    <rect x="35" y="170" width="150" height="34" rx="4" fill="#0d6efd" />
    <text x="110" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Modifier le DOM</text>
  </g>

  <!-- Central Action Arrow -->
  <g transform="translate(435, 140)">
    <circle cx="35" cy="40" r="28" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2" />
    <path d="M 23 40 L 47 40" stroke="#0d6efd" stroke-width="3" marker-end="url(#arrow-action)" />
    <text x="35" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d6efd">Clic souris</text>
    <text x="35" y="99" text-anchor="middle" font-size="10" fill="#495057">Action JS</text>
  </g>

  <!-- Right: État Après manipulation du DOM -->
  <g transform="translate(515, 60)" filter="url(#shadow3)">
    <rect width="390" height="250" rx="8" fill="#ffffff" stroke="#198754" stroke-width="1.5" />
    <!-- Badge Status -->
    <rect x="0" y="0" width="390" height="32" rx="8" fill="#e8f5e9" />
    <rect x="0" y="24" width="390" height="8" fill="#e8f5e9" />
    <line x1="0" y1="32" x2="390" y2="32" stroke="#c8e6c9" />
    <rect x="15" y="7" width="140" height="18" rx="9" fill="#198754" />
    <text x="85" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Après manipulation JS</text>

    <!-- Card Content -->
    <rect x="20" y="50" width="350" height="180" rx="6" fill="#f8fafc" stroke="#c8e6c9" />
    
    <!-- Title changed color and text -->
    <text x="35" y="80" font-size="15" font-weight="bold" fill="#198754">DOM modifié avec succès !</text>
    
    <!-- Text box updated innerHTML and style -->
    <rect x="35" y="95" width="320" height="60" rx="4" fill="#d1e7dd" stroke="#a3cfbb" />
    <text x="48" y="120" font-size="12" fill="#0f5132">Le texte a été <tspan font-weight="bold">mis à jour</tspan> en temps réel</text>
    <text x="48" y="138" font-size="12" fill="#0f5132">sans rechargement de la page.</text>

    <!-- Button disabled / confirmed -->
    <rect x="35" y="170" width="150" height="34" rx="4" fill="#198754" />
    <text x="110" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">✓ Action effectuée</text>
  </g>
</svg>