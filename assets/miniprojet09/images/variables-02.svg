<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="100%" height="100%" style="background:#202124; border-radius:8px; font-family:'Consolas', 'Courier New', monospace;">
  <!-- DevTools Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#2d2f34"/>
  <rect x="0" y="26" width="540" height="8" fill="#2d2f34"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#3c4043" stroke-width="1"/>
  
  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Console Tab Indicator -->
  <rect x="68" y="7" width="80" height="20" rx="3" fill="#3c4043"/>
  <text x="108" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#e8eaed" text-anchor="middle">Console</text>
  
  <!-- Filter / Error count indicator -->
  <rect x="160" y="8" width="52" height="18" rx="9" fill="#5c0000"/>
  <circle cx="170" cy="17" r="4" fill="#f28b82"/>
  <text x="180" y="21" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#f28b82">1 error</text>

  <text x="520" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#80868b" text-anchor="end">DevTools (F12)</text>

  <!-- Error Message Row -->
  <rect x="0" y="35" width="540" height="66" fill="#290000" stroke="#5c0000" stroke-width="1"/>
  <g transform="translate(15, 52)">
    <!-- Red Error Cross Icon -->
    <circle cx="6" cy="6" r="6" fill="#ea4335"/>
    <text x="6" y="9.5" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">×</text>

    <!-- Error Text -->
    <text x="20" y="9" font-size="11.5" font-weight="bold" fill="#f28b82">Uncaught ReferenceError: X is not defined</text>
    <text x="510" y="9" font-size="10" fill="#f28b82" text-anchor="end">script.js:2</text>
    
    <!-- Stack trace line -->
    <text x="32" y="28" font-size="10.5" fill="#e8eaed">at script.js:2:13</text>
  </g>

  <!-- Prompt line -->
  <g transform="translate(15, 120)">
    <path d="M 0 5 L 7 9 L 0 13 Z" fill="#1a73e8"/>
    <rect x="14" y="2" width="7" height="13" fill="#e8eaed" opacity="0.8"/>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="10" y="148" width="520" height="40" rx="4" fill="#321c1d" stroke="#f87171" stroke-width="1"/>
  <text x="270" y="165" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">
    ⚠️ Sensibilité à la casse : la variable déclarée est <tspan fill="#ffffff">x</tspan> (minuscule)
  </text>
  <text x="270" y="181" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#fecaca" text-anchor="middle">
    L'appel à <tspan fill="#ffffff">X</tspan> (majuscule) bloque immédiatement l'exécution du script.
  </text>
</svg>