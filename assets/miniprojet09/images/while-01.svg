<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%" style="background:#ffffff; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-wh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="0" y="0" width="540" height="280" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Browser Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#f8f9fa"/>
  <rect x="0" y="26" width="540" height="8" fill="#f8f9fa"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#dee2e6" stroke-width="1"/>

  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Address Bar -->
  <rect x="70" y="6" width="450" height="22" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="80" y="21" font-size="11" fill="#6c757d">http://localhost/pgcd-while.html</text>

  <!-- Input Summary Cards -->
  <g transform="translate(25, 46)">
    <!-- Prompt a Badge -->
    <rect x="0" y="0" width="235" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="12" y="21" font-size="11" fill="#475569">prompt(&quot;Donner a ?&quot;) &#8594; <tspan font-family="'Consolas', monospace" font-weight="bold" fill="#0284c7">25</tspan></text>

    <!-- Prompt b Badge -->
    <rect x="255" y="0" width="235" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="267" y="21" font-size="11" fill="#475569">prompt(&quot;Donner b ?&quot;) &#8594; <tspan font-family="'Consolas', monospace" font-weight="bold" fill="#0284c7">35</tspan></text>
  </g>

  <!-- Result Rendering in Page -->
  <g transform="translate(25, 92)">
    <rect width="490" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" filter="url(#shadow-wh)"/>
    <text x="16" y="25" font-size="13" font-weight="bold" fill="#1e293b">Calcul du PGCD :</text>
    <text x="16" y="50" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#0d6efd">
      PGCD(25, 35) = <tspan fill="#16a34a">5</tspan>
    </text>
  </g>

  <!-- Euclide Steps summary -->
  <g transform="translate(25, 170)">
    <rect width="490" height="58" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="18" font-size="10.5" font-weight="600" fill="#64748b">Étapes de la boucle while (b1 != 0) :</text>
    <text x="14" y="35" font-family="'Consolas', monospace" font-size="10" fill="#475569">
      &#8226; a1=35, b1=25 (r=10)   &#8226; a1=25, b1=10 (r=5)   &#8226; a1=10, b1=5 (r=0) &#8594; Arrêt
    </text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="240" width="490" height="28" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="270" y="258" font-size="11" fill="#166534" text-anchor="middle" font-weight="500">
    💡 Répétition tant que la condition <tspan font-weight="bold">(b1 != 0)</tspan> reste vraie.
  </text>
</svg>