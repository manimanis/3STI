<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" width="100%" height="100%" style="background:#202124; border-radius:8px; font-family:'Consolas', 'Courier New', monospace;">
  <!-- DevTools Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#2d2f34"/>
  <rect x="0" y="26" width="540" height="8" fill="#2d2f34"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#3c4043" stroke-width="1"/>
  
  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Console Tab Indicator -->
  <rect x="68" y="7" width="80" height="20" rx="3" fill="#3c4043"/>
  <text x="108" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#e8eaed" text-anchor="middle">Console</text>
  <text x="160" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9aa0a6">Éléments</text>
  <text x="225" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#9aa0a6">Sources</text>

  <text x="520" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#80868b" text-anchor="end">DevTools (F12)</text>

  <!-- Output Lines -->
  <!-- Line 1: typeof 5.6 -> "number" -->
  <g transform="translate(15, 50)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;number&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:1</text>
  </g>
  <line x1="10" y1="67" x2="530" y2="67" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 2: typeof 17 -> "number" -->
  <g transform="translate(15, 77)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;number&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:2</text>
  </g>
  <line x1="10" y1="94" x2="530" y2="94" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 3: typeof Number.NaN -> "number" -->
  <g transform="translate(15, 104)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;number&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:3</text>
  </g>
  <line x1="10" y1="121" x2="530" y2="121" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 4: typeof "ayoub" -> "string" -->
  <g transform="translate(15, 131)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;string&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:5</text>
  </g>
  <line x1="10" y1="148" x2="530" y2="148" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 5: typeof (5 > 6) -> "boolean" -->
  <g transform="translate(15, 158)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;boolean&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:7</text>
  </g>
  <line x1="10" y1="175" x2="530" y2="175" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 6: typeof [1, 2, 3] -> "object" -->
  <g transform="translate(15, 185)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;object&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:9</text>
  </g>
  <line x1="10" y1="202" x2="530" y2="202" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 7: typeof null -> "object" -->
  <g transform="translate(15, 212)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;object&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:10</text>
  </g>
  <line x1="10" y1="229" x2="530" y2="229" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 8: typeof x -> "undefined" -->
  <g transform="translate(15, 239)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;undefined&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:13</text>
  </g>
  <line x1="10" y1="256" x2="530" y2="256" stroke="#282a2d" stroke-width="1"/>

  <!-- Line 9: typeof Math.abs -> "function" -->
  <g transform="translate(15, 266)">
    <path d="M 0 5 L 6 9 L 0 13 Z" fill="#80868b"/>
    <text x="14" y="10" font-size="11.5" fill="#ce9178">&quot;function&quot;</text>
    <text x="510" y="10" font-size="9.5" fill="#80868b" text-anchor="end">script.js:15</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="10" y="290" width="520" height="30" rx="4" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
  <text x="270" y="309" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#a0aec0" text-anchor="middle">
    💡 L'opérateur <tspan fill="#68d391" font-weight="bold">typeof</tspan> renvoie toujours le type sous forme de chaîne textuelle.
  </text>
</svg>