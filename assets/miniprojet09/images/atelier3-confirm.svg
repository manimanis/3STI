<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background:#f8fafc; border-radius:8px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="c2shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Confirm Modal Window -->
  <g transform="translate(40, 15)" filter="url(#c2shadow)">
    <rect width="420" height="105" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    
    <!-- Header -->
    <circle cx="16" cy="18" r="6" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <text x="28" y="22" font-size="11.5" font-weight="600" fill="#202124">127.0.0.1 indique (confirm)</text>
    
    <!-- Confirm question -->
    <text x="16" y="52" font-size="13" fill="#3c4043">Voulez-vous vraiment vider votre panier d'achats ?</text>
    
    <!-- Buttons -->
    <rect x="270" y="70" width="60" height="24" rx="3" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="300" y="86" font-size="11" fill="#1a73e8" text-anchor="middle">Annuler</text>

    <rect x="340" y="70" width="64" height="24" rx="3" fill="#1a73e8"/>
    <text x="372" y="86" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
  </g>

  <!-- Outcomes: OK vs Annuler -->
  <g transform="translate(40, 135)">
    <!-- Branch OK -->
    <g transform="translate(0, 0)">
      <rect width="200" height="85" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <rect width="200" height="22" rx="6" fill="#dcfce7"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#166534">&#10003; Si [OK] (reponse === true)</text>
      <text x="10" y="42" font-size="11.5" fill="#1e293b">Action valid&#233;e :</text>
      <text x="10" y="62" font-size="11.5" font-weight="600" fill="#15803d">&#171; Le panier a &#233;t&#233; vid&#233;. &#187;</text>
    </g>

    <!-- Branch Annuler -->
    <g transform="translate(220, 0)">
      <rect width="200" height="85" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
      <rect width="200" height="22" rx="6" fill="#fee2e2"/>
      <text x="10" y="16" font-size="11" font-weight="700" fill="#991b1b">&#10007; Si [Annuler] (reponse === false)</text>
      <text x="10" y="42" font-size="11.5" fill="#1e293b">Action annul&#233;e :</text>
      <text x="10" y="62" font-size="11.5" font-weight="600" fill="#b91c1c">&#171; Op&#233;ration annul&#233;e. &#187;</text>
    </g>
  </g>
</svg>