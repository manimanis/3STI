<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="100%" height="100%" style="background:#ffffff; border-radius:8px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Browser Window Frame -->
  <rect x="0" y="0" width="540" height="210" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Browser Header -->
  <rect x="0" y="0" width="540" height="34" rx="8" fill="#f8f9fa"/>
  <rect x="0" y="26" width="540" height="8" fill="#f8f9fa"/>
  <line x1="0" y1="34" x2="540" y2="34" stroke="#dee2e6" stroke-width="1"/>

  <circle cx="16" cy="17" r="5" fill="#ea4335"/>
  <circle cx="32" cy="17" r="5" fill="#fbbc04"/>
  <circle cx="48" cy="17" r="5" fill="#34a853"/>

  <!-- Address Bar -->
  <rect x="70" y="6" width="450" height="22" rx="4" fill="#ffffff" stroke="#ced4da"/>
  <text x="80" y="21" font-size="11" fill="#6c757d">http://localhost/boucle-for.html</text>

  <!-- Webpage Body Canvas -->
  <g transform="translate(25, 52)">
    <text x="0" y="18" font-size="14" font-weight="bold" fill="#212529">Nombres pairs :</text>
    
    <!-- Rendered numbers -->
    <g transform="translate(0, 32)">
      <rect width="490" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
      <g transform="translate(15, 14)">
        <!-- Number Badges -->
        <g transform="translate(0, 0)">
          <rect width="36" height="30" rx="4" fill="#0d6efd"/>
          <text x="18" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>
        </g>
        <g transform="translate(48, 0)">
          <rect width="36" height="30" rx="4" fill="#0d6efd"/>
          <text x="18" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
        </g>
        <g transform="translate(96, 0)">
          <rect width="36" height="30" rx="4" fill="#0d6efd"/>
          <text x="18" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
        </g>
        <g transform="translate(144, 0)">
          <rect width="36" height="30" rx="4" fill="#0d6efd"/>
          <text x="18" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
        </g>
        <g transform="translate(192, 0)">
          <rect width="36" height="30" rx="4" fill="#0d6efd"/>
          <text x="18" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
        </g>
        <g transform="translate(240, 0)">
          <rect width="44" height="30" rx="4" fill="#0d6efd"/>
          <text x="22" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">10</text>
        </g>
        <g transform="translate(296, 0)">
          <rect width="44" height="30" rx="4" fill="#0d6efd"/>
          <text x="22" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
        </g>
        <g transform="translate(352, 0)">
          <rect width="44" height="30" rx="4" fill="#0d6efd"/>
          <text x="22" y="20" font-family="'Consolas', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">14</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <rect x="25" y="166" width="490" height="28" rx="4" fill="#e7f1ff" stroke="#bfdbfe"/>
  <text x="270" y="184" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="500">
    💡 Compteur déterminé : <tspan font-weight="bold">i</tspan> parcourt l'intervalle [0, 15] avec le test <tspan font-weight="bold">i % 2 == 0</tspan>.
  </text>
</svg>