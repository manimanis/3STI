<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background overlay mockup -->
  <rect width="100%" height="100%" fill="#f1f3f4" rx="8"/>

  <!-- Modal Dialog Window -->
  <g filter="url(#shadow)">
    <rect x="30" y="25" width="460" height="150" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
  </g>

  <!-- Header: Origin with icon -->
  <g transform="translate(50, 48)">
    <!-- Globe icon -->
    <circle cx="10" cy="10" r="8" fill="none" stroke="#5f6368" stroke-width="1.5"/>
    <ellipse cx="10" cy="10" rx="3.5" ry="8" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <line x1="2" y1="10" x2="18" y2="10" stroke="#5f6368" stroke-width="1.2"/>
    <line x1="4" y1="5" x2="16" y2="5" stroke="#5f6368" stroke-width="1"/>
    <line x1="4" y1="15" x2="16" y2="15" stroke="#5f6368" stroke-width="1"/>

    <!-- Site origin title -->
    <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#202124">127.0.0.1:5500 indique</text>
  </g>

  <!-- Alert Message Text -->
  <text x="50" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#3c4043">
    Félicitations ! Votre score est de 18 / 20.
  </text>

  <!-- OK Button -->
  <g transform="translate(405, 128)">
    <rect width="65" height="32" rx="4" fill="#1a73e8"/>
    <text x="32.5" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">OK</text>
  </g>
</svg>

