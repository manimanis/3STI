<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="100%" height="100%">
  <defs>
    <filter id="f2shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect x="2" y="2" width="456" height="356" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#f2shadow)" />

  <!-- Window Header -->
  <rect x="2" y="2" width="456" height="36" rx="8" fill="#f8fafc" />
  <path d="M 2 38 L 458 38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="18" cy="20" r="4.5" fill="#ef4444" />
  <circle cx="32" cy="20" r="4.5" fill="#f59e0b" />
  <circle cx="46" cy="20" r="4.5" fill="#10b981" />

  <!-- Address Bar -->
  <rect x="65" y="10" width="375" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="75" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">http://127.0.0.1:5500/javascript06.html (3 opérandes)</text>

  <!-- Form Content Area -->
  <g transform="translate(25, 55)">
    <!-- Field a -->
    <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">a</text>
    <rect x="95" y="4" width="105" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="105" y="21" font-family="Consolas, Monaco, monospace" font-size="13" fill="#0f172a">9</text>

    <!-- Field b -->
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">b</text>
    <rect x="95" y="36" width="105" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="105" y="53" font-family="Consolas, Monaco, monospace" font-size="13" fill="#0f172a">16</text>

    <!-- Field c -->
    <text x="0" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">c</text>
    <rect x="95" y="68" width="105" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="105" y="85" font-family="Consolas, Monaco, monospace" font-size="13" fill="#0f172a">2</text>

    <!-- Separator -->
    <line x1="0" y1="104" x2="405" y2="104" stroke="#e2e8f0" stroke-width="1" />

    <!-- Result a + b + c -->
    <text x="0" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">a + b + c =</text>
    <rect x="95" y="112" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="105" y="129" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#0f172a">27</text>

    <!-- Result a - b - c -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">a - b - c =</text>
    <rect x="95" y="144" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="105" y="161" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#0f172a">-9</text>

    <!-- Result a * b * c -->
    <text x="0" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">a &#215; b &#215; c =</text>
    <rect x="95" y="176" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="105" y="193" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#0f172a">288</text>

    <!-- Result a / b / c -->
    <text x="0" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e293b">a / b / c =</text>
    <rect x="95" y="208" width="120" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="105" y="225" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#0f172a">0.28125</text>

    <!-- Calculation Pill -->
    <g transform="translate(0, 246)">
      <rect x="0" y="0" width="410" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <text x="12" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#166534">
        &#10003; 4 r&#233;sultats calcul&#233;s dynamiquement via value
      </text>
    </g>
  </g>
</svg>
