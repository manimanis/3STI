<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%" style="background:#f8fafc; border-radius:8px; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="mshadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Prompt Modal Window -->
  <g transform="translate(40, 15)" filter="url(#mshadow)">
    <rect width="420" height="120" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    
    <!-- Header -->
    <circle cx="16" cy="18" r="6" fill="none" stroke="#5f6368" stroke-width="1.2"/>
    <text x="28" y="22" font-size="11.5" font-weight="600" fill="#202124">127.0.0.1 indique (prompt)</text>
    
    <!-- Prompt message -->
    <text x="16" y="48" font-size="12.5" fill="#3c4043">Donner le rayon du cercle (en cm) :</text>
    
    <!-- Input Field -->
    <rect x="16" y="58" width="388" height="26" rx="4" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="26" y="75" font-family="Consolas, Monaco, monospace" font-size="13" fill="#202124">5</text>
    <line x1="36" y1="63" x2="36" y2="79" stroke="#1a73e8" stroke-width="1.2"/>

    <!-- Buttons -->
    <rect x="270" y="90" width="60" height="22" rx="3" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="300" y="105" font-size="11" fill="#1a73e8" text-anchor="middle">Annuler</text>

    <rect x="340" y="90" width="64" height="22" rx="3" fill="#1a73e8"/>
    <text x="372" y="105" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">OK</text>
  </g>

  <!-- Output Display in Page -->
  <g transform="translate(40, 150)">
    <rect width="420" height="75" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="420" height="24" rx="6" fill="#f1f5f9"/>
    <line x1="0" y1="24" x2="420" y2="24" stroke="#e2e8f0"/>
    <text x="12" y="16" font-size="11" font-weight="600" fill="#475569">Affichage du r&#233;sultat calcul&#233; dans la page :</text>

    <text x="15" y="44" font-size="12.5" fill="#1e293b">
      Rayon : <tspan font-weight="bold">r = 5 cm</tspan>
    </text>
    <text x="15" y="64" font-size="12.5" fill="#1e40af" font-weight="600">
      P&#233;rim&#232;tre = 31.42 cm | Surface = 78.54 cm&#178;
    </text>
  </g>
</svg>