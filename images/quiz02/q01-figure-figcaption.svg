<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <linearGradient id="figGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser window frame -->
  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow1)" />
  <path d="M 15 20 A 10 10 0 0 1 25 10 L 515 10 A 10 10 0 0 1 525 20 L 525 38 L 15 38 Z" fill="#f1f5f9" />
  <circle cx="32" cy="24" r="4" fill="#f87171" />
  <circle cx="44" cy="24" r="4" fill="#fbbf24" />
  <circle cx="56" cy="24" r="4" fill="#34d399" />
  <text x="75" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">Association sémantique : Figure &amp; Légende</text>

  <!-- Container <figure> -->
  <rect x="40" y="52" width="460" height="142" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="52" y="44" width="80" height="20" rx="4" fill="#4f46e5" />
  <text x="92" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;figure&gt;</text>

  <!-- Image mock inside figure -->
  <rect x="60" y="74" width="170" height="104" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5" />
  <circle cx="110" cy="115" r="22" fill="#6366f1" opacity="0.4" />
  <polygon points="175,90 215,150 135,150" fill="#818cf8" opacity="0.7" />
  <text x="145" y="170" font-family="monospace" font-size="10" fill="#4338ca" text-anchor="middle">&lt;img&gt;</text>

  <!-- Plus symbol -->
  <text x="252" y="132" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#6366f1">+</text>

  <!-- Highlighted <figcaption> -->
  <rect x="285" y="78" width="195" height="96" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <rect x="297" y="70" width="105" height="20" rx="4" fill="#10b981" />
  <text x="349" y="84" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;figcaption&gt;</text>
  <text x="382" y="115" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">Légende descriptive</text>
  <text x="382" y="135" font-family="'Segoe UI', sans-serif" font-size="10" fill="#047857" text-anchor="middle">« Fig 1. Schéma illustratif »</text>
  <text x="382" y="158" font-family="'Segoe UI', sans-serif" font-size="10" font-style="italic" fill="#059669" text-anchor="middle">(Premier ou dernier enfant)</text>
</svg>
