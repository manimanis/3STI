  <circle cx="44" cy="24" r="4" fill="#fbbf24" />
  <circle cx="56" cy="24" r="4" fill="#34d399" />
  <text x="75" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">Bloc dépliable interactif natif : &lt;details&gt; &amp; &lt;summary&gt;</text>

  <!-- <details> Box -->
  <rect x="40" y="52" width="460" height="142" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  
  <!-- <details> Tag Badge -->
  <rect x="52" y="44" width="80" height="20" rx="4" fill="#475569" />
  <text x="92" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;details&gt;</text>

  <!-- Interactive Feature Badge (moved to top-right of box to avoid any text collision) -->
