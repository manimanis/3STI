  <text x="445" y="58" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Interactif</text>

  <!-- <summary> Header Bar -->
  <rect x="55" y="70" width="430" height="36" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2" />
  <polygon points="72,82 72,94 82,88" fill="#4f46e5" />
  <text x="92" y="93" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#4338ca">&lt;summary&gt; Cliquez pour afficher les détails &lt;/summary&gt;</text>

  <!-- Hidden Content preview -->
  <rect x="55" y="116" width="430" height="66" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="4,4" />
  <circle cx="78" cy="138" r="4" fill="#10b981" />
  <text x="92" y="142" font-family="'Segoe UI', sans-serif" font-size="11" fill="#334155">Contenu masqué ou révélé sans une seule ligne de JavaScript !</text>
