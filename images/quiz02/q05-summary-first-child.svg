<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="shadow5" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow5)" />
  <path d="M 15 20 A 10 10 0 0 1 25 10 L 515 10 A 10 10 0 0 1 525 20 L 525 38 L 15 38 Z" fill="#f1f5f9" />
  <circle cx="32" cy="24" r="4" fill="#f87171" />
  <circle cx="44" cy="24" r="4" fill="#fbbf24" />
  <circle cx="56" cy="24" r="4" fill="#34d399" />
  <text x="75" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">Règle de structure : &lt;summary&gt; doit être le 1er enfant direct</text>

  <!-- Container tree -->
  <rect x="40" y="52" width="460" height="142" rx="8" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5" />
  
  <!-- <details> Tag Badge -->
  <rect x="52" y="44" width="80" height="20" rx="4" fill="#4f46e5" />
  <text x="92" y="58" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;details&gt;</text>

  <!-- Obligatoire en tête Badge (on top border to prevent any collision) -->
  <rect x="345" y="44" width="145" height="20" rx="4" fill="#047857" />
  <text x="417" y="58" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ En tête obligatoire</text>

  <!-- Child 1: <summary> (HIGHLIGHTED AS 1ST CHILD) -->
  <rect x="65" y="72" width="410" height="36" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
  
  <!-- 1er Enfant Badge -->
  <rect x="75" y="78" width="105" height="24" rx="4" fill="#10b981" />
  <text x="127" y="94" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1er ENFANT DIRECT</text>
  
  <!-- <summary> Code (with ample free space to the right) -->
  <text x="195" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#065f46">&lt;summary&gt; Titre &lt;/summary&gt;</text>

  <!-- Child 2, 3: other content -->
  <rect x="65" y="116" width="410" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" />
  <text x="80" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold" fill="#334155">2e enfant :</tspan> &lt;p&gt; Paragraphe de description &lt;/p&gt;</text>

  <rect x="65" y="152" width="410" height="30" rx="5" fill="#ffffff" stroke="#e2e8f0" />
  <text x="80" y="171" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569"><tspan font-weight="bold" fill="#334155">3e enfant :</tspan> &lt;ul&gt; Liste à puces complémentaire &lt;/ul&gt;</text>
</svg>
