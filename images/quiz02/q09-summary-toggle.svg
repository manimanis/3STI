<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="shadow9" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow9)" />
  <path d="M 15 20 A 10 10 0 0 1 25 10 L 515 10 A 10 10 0 0 1 525 20 L 525 38 L 15 38 Z" fill="#f1f5f9" />
  <circle cx="32" cy="24" r="4" fill="#f87171" />
  <circle cx="44" cy="24" r="4" fill="#fbbf24" />
  <circle cx="56" cy="24" r="4" fill="#34d399" />
  <text x="75" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#64748b">Action utilisateur : Clic interactif sur &lt;summary&gt;</text>

  <!-- Left state: before click -->
  <rect x="40" y="60" width="200" height="70" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
  <polygon points="55,85 55,97 65,91" fill="#4f46e5" />
  <text x="75" y="94" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#4338ca">&lt;summary&gt; Titre</text>
  <text x="140" y="118" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Bloc fermé au repos)</text>

  <!-- Cursor pointer -->
  <g transform="translate(190, 85)">
    <path d="M0,0 L0,18 L5,14 L9,22 L13,20 L9,12 L15,12 Z" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="2" cy="2" r="8" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Arrow transition -->
  <text x="270" y="105" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#6366f1" text-anchor="middle">➔</text>
  <text x="270" y="125" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#6366f1" text-anchor="middle">CLIC</text>

  <!-- Right state: after click -->
  <rect x="300" y="60" width="200" height="130" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <polygon points="315,80 327,80 321,88" fill="#10b981" />
  <text x="335" y="87" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065f46">&lt;summary&gt; Titre</text>
  <rect x="312" y="100" width="176" height="78" rx="4" fill="#ffffff" stroke="#a7f3d0" />
  <text x="325" y="122" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#047857">1. Le triangle pivote</text>
  <text x="325" y="142" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#047857">2. Le bloc s'ouvre</text>
  <text x="325" y="162" font-family="'Segoe UI', sans-serif" font-size="10" fill="#059669">3. L'attribut open s'active</text>
</svg>
