<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="Exercice 6 — Les chiffres d'un nombre avec while (exemple : n = 4725)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="760" height="260" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/>
  <rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 6 — Les chiffres d'un nombre avec while (exemple : n = 4725)</text>

  <!-- Box 1: Données -->
  <rect x="16" y="54" width="160" height="188" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="16" y="54" width="160" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="16" y="70" width="160" height="12" fill="#1d4ed8"/>
  <text x="96" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">DONNÉES</text>
  <text x="28" y="108" fill="#fbbf24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">n = 4725</text>
  <text x="28" y="132" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">copie = n (4725)</text>
  <text x="28" y="156" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">nbChiffres = 0</text>
  <text x="28" y="176" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">somme = 0</text>
  <text x="28" y="196" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">inverse = 0</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="148" x2="202" y2="148" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Trace while -->
  <rect x="208" y="54" width="334" height="188" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="208" y="54" width="334" height="28" rx="9" fill="#4f46e5"/>
  <rect x="208" y="70" width="334" height="12" fill="#4f46e5"/>
  <text x="375" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">BOUCLE while (copie &gt; 0)</text>

  <!-- Table header -->
  <text x="220" y="102" fill="#a5b4fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700">Tour</text>
  <text x="262" y="102" fill="#a5b4fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700">chiffre (% 10)</text>
  <text x="362" y="102" fill="#a5b4fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700">inverse</text>
  <text x="430" y="102" fill="#a5b4fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700">copie (trunc / 10)</text>
  <line x1="218" y1="109" x2="532" y2="109" stroke="#4338ca" stroke-width="1"/>

  <text x="224" y="130" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">1</text>
  <text x="262" y="130" fill="#fbbf24" font-family="Consolas, monospace" font-size="12.5">4725 % 10 = 5</text>
  <text x="370" y="130" fill="#34d399" font-family="Consolas, monospace" font-size="12.5">5</text>
  <text x="445" y="130" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12.5">472</text>

  <text x="224" y="156" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">2</text>
  <text x="262" y="156" fill="#fbbf24" font-family="Consolas, monospace" font-size="12.5"> 472 % 10 = 2</text>
  <text x="370" y="156" fill="#34d399" font-family="Consolas, monospace" font-size="12.5">52</text>
  <text x="445" y="156" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12.5">47</text>

  <text x="224" y="182" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">3</text>
  <text x="262" y="182" fill="#fbbf24" font-family="Consolas, monospace" font-size="12.5">  47 % 10 = 7</text>
  <text x="370" y="182" fill="#34d399" font-family="Consolas, monospace" font-size="12.5">527</text>
  <text x="445" y="182" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12.5">4</text>

  <text x="224" y="208" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12.5">4</text>
  <text x="262" y="208" fill="#fbbf24" font-family="Consolas, monospace" font-size="12.5">   4 % 10 = 4</text>
  <text x="370" y="208" fill="#34d399" font-family="Consolas, monospace" font-size="12.5">5274</text>
  <text x="445" y="208" fill="#f87171" font-family="Consolas, monospace" font-size="12.5">0 (arrêt)</text>

  <text x="220" y="232" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">somme = 5 + 2 + 7 + 4 = 18</text>

  <!-- Arrow 2 -->
  <line x1="546" y1="148" x2="568" y2="148" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Résultat -->
  <rect x="574" y="54" width="170" height="188" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="574" y="54" width="170" height="28" rx="9" fill="#059669"/>
  <rect x="574" y="70" width="170" height="12" fill="#059669"/>
  <text x="659" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">RÉSULTAT</text>

  <text x="586" y="108" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">4 chiffres</text>
  <text x="586" y="136" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Somme : 18</text>
  <text x="586" y="164" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Inverse : 5274</text>
  <text x="586" y="202" fill="#a7f3d0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">n reste intact : 4725</text>
</svg>
