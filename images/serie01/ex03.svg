<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225" role="img" aria-label="Exercice 3 — Moyenne et moyenne tronquée (exemple : 13, 14, 11.5)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="760" height="225" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/>
  <rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 3 — Moyenne et moyenne tronquée (exemple : 13, 14, 11.5)</text>

  <rect x="16" y="54" width="210" height="152" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="16" y="54" width="210" height="28" rx="9" fill="#1d4ed8"/>
  <rect x="16" y="70" width="210" height="12" fill="#1d4ed8"/>
  <text x="121" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">DONNÉES SAISIES</text>
  <text x="28" y="106" fill="#fbbf24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Note 1 = 13</text>
  <text x="28" y="128" fill="#fbbf24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Note 2 = 14</text>
  <text x="28" y="150" fill="#fbbf24" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Note 3 = 11.5</text>
  <text x="28" y="172" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500">(entre 0 et 20)</text>

  <line x1="230" y1="130" x2="256" y2="130" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="262" y="54" width="236" height="152" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="262" y="54" width="236" height="28" rx="9" fill="#4f46e5"/>
  <rect x="262" y="70" width="236" height="12" fill="#4f46e5"/>
  <text x="380" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">TRAITEMENT</text>
  <text x="274" y="106" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500">(13 + 14 + 11.5) / 3 = 12.833...</text>
  <text x="274" y="128" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500">Math.trunc(12.833...) → 12</text>
  <text x="274" y="150" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500">(coupe .833 sans arrondir)</text>
  <text x="274" y="172" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="500">12.833... &gt;= 10 → vrai</text>

  <line x1="502" y1="130" x2="528" y2="130" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="534" y="54" width="210" height="152" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="534" y="54" width="210" height="28" rx="9" fill="#059669"/>
  <rect x="534" y="70" width="210" height="12" fill="#059669"/>
  <text x="639" y="73" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5" font-weight="700">RÉSULTAT ATTENDU</text>
  <text x="546" y="106" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Moyenne exacte : 12.833...</text>
  <text x="546" y="128" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Moyenne tronquée : 12</text>
  <text x="546" y="150" fill="#34d399" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5" font-weight="700">Message : &quot;Admis&quot;</text>
</svg>
