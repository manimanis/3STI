<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="100%" height="100%">
  <defs>
    <!-- Ombre douce pour le conteneur principal -->
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Ombre pour la flèche et le badge central -->
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <!-- Dégradé flèche de liaison -->
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Fond global de la carte -->
  <rect x="10" y="8" width="860" height="258" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Barre d'en-tête façon fenêtre de navigateur -->
  <path d="M 10 20 A 12 12 0 0 1 22 8 L 858 8 A 12 12 0 0 1 870 20 L 870 38 L 10 38 Z" fill="#f8fafc" />
  <line x1="10" y1="38" x2="870" y2="38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="30" cy="23" r="4" fill="#f87171" />
  <circle cx="46" cy="23" r="4" fill="#fbbf24" />
  <circle cx="62" cy="23" r="4" fill="#34d399" />

  <text x="84" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
    🎯 Règle d'or du ciblage HTML5 : Correspondance exacte target ➔ name
  </text>

  <!-- Badge Sensible à la casse -->
  <rect x="706" y="12" width="150" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
  <text x="781" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">
    ⚠️ Sensible à la casse
  </text>

  <!-- =====================================================================
       1. PANNEAU GAUCHE : LE LIEN ÉMETTEUR (<a>)
       ===================================================================== -->
  <g id="panneau-gauche" transform="translate(26, 46)">
    <!-- Cadre extérieur -->
    <rect x="0" y="0" width="366" height="206" rx="8" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1.4" />

    <!-- Badge En-tête -->
    <rect x="14" y="-9" width="150" height="20" rx="4" fill="#2563eb" />
    <text x="89" y="5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      1. Lien émetteur &lt;a&gt;
    </text>

    <text x="14" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#475569">
      Fichier index.html (Source) :
    </text>

    <!-- Bloc de code syntaxique -->
    <rect x="12" y="28" width="342" height="130" rx="6" fill="#0f172a" stroke="#1e293b" />

    <!-- Ligne 1 : <a href="chapitre2.html" -->
    <text font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#e2e8f0">
      <tspan x="20" y="54" fill="#94a3b8">&lt;</tspan><tspan fill="#38bdf8">a</tspan> <tspan fill="#a78bfa">href</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"chapitre2.html"</tspan>
    </text>

    <!-- Surlignage ajusté au plus près de target="zone_cours" -->
    <rect x="16" y="62" width="220" height="30" rx="5" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2" />
    <text font-family="'Consolas', 'Courier New', monospace" font-size="18" font-weight="bold">
      <tspan x="20" y="84" fill="#fbbf24">target</tspan><tspan fill="#f8fafc">=</tspan><tspan fill="#fde047">"zone_cours"</tspan><tspan fill="#94a3b8">&gt;</tspan>
    </text>

    <!-- Lignes 3 & 4 : contenu et balise fermante -->
    <text font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#e2e8f0">
      <tspan x="34" y="114" fill="#ffffff">📙 Chapitre 2 : Balises</tspan>
      <tspan x="20" y="142" fill="#94a3b8">&lt;/</tspan><tspan fill="#38bdf8">a</tspan><tspan fill="#94a3b8">&gt;</tspan>
    </text>

    <!-- Cadre sous le code : Rendu du lien cliquable -->
    <rect x="12" y="168" width="225" height="30" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
    <text x="22" y="188" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">
      📙 Chapitre 2 : Balises HTML5
    </text>

    <!-- Curseur pointeur de clic -->
    <g transform="translate(198, 178)">
      <polygon points="0,0 0,14 3.5,11 7,17 9.5,16 6,10 11,10" fill="#1e293b" stroke="#ffffff" stroke-width="1.2" />
    </g>
    <text x="246" y="188" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="800" fill="#d97706">CLIC !</text>
  </g>

  <!-- =====================================================================
       2. PANNEAU DROIT : LE CADRE RÉCEPTEUR (<iframe>)
       ===================================================================== -->
  <g id="panneau-droit" transform="translate(488, 46)">
    <!-- Cadre extérieur -->
    <rect x="0" y="0" width="366" height="206" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.4" />

    <!-- Badge En-tête -->
    <rect x="14" y="-9" width="168" height="20" rx="4" fill="#059669" />
    <text x="98" y="5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      2. Cadre récepteur &lt;iframe&gt;
    </text>

    <text x="14" y="20" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#475569">
      Fichier index.html (Récepteur) :
    </text>

    <!-- Bloc de code syntaxique -->
    <rect x="12" y="28" width="342" height="102" rx="6" fill="#0f172a" stroke="#1e293b" />

    <!-- Surlignage ajusté au plus près de name="zone_cours" -->
    <rect x="98" y="32" width="202" height="30" rx="5" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2" />

    <text font-family="'Consolas', 'Courier New', monospace" font-size="18" fill="#e2e8f0">
      <tspan x="18" y="54" fill="#94a3b8">&lt;</tspan><tspan fill="#34d399">iframe</tspan> <tspan fill="#34d399" font-weight="bold">name</tspan><tspan fill="#ffffff">=</tspan><tspan fill="#a7f3d0" font-weight="bold">"zone_cours"</tspan>
      <tspan x="36" y="82" fill="#a78bfa">src</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"chapitre1.html"</tspan><tspan fill="#94a3b8">&gt;</tspan>
      <tspan x="18" y="110" fill="#94a3b8">&lt;/</tspan><tspan fill="#34d399">iframe</tspan><tspan fill="#94a3b8">&gt;</tspan>
    </text>

    <!-- Cadre compact sous name="zone_cours" : Rendu de l'iframe -->
    <rect x="12" y="142" width="342" height="38" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
    <circle cx="26" cy="161" r="3" fill="#10b981" />
    <text x="36" y="165" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#047857">
      Cadre "zone_cours" :
    </text>
    <rect x="152" y="148" width="194" height="26" rx="4" fill="#ffffff" stroke="#a7f3d0" />
    <text x="160" y="165" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#0f172a">
      📙 Chapitre 2 (affiché sans rechargement)
    </text>
  </g>

  <!-- =====================================================================
       3. PONT CENTRAL & FLÈCHE AU PREMIER PLAN (RELIANT target à name)
       ===================================================================== -->
  <g id="fleche-liaison-premier-plan">
    <!-- Flèche reliant le surlignage target au surlignage name -->
    <path d="M 382,123 C 420,123 455,93 496,93" fill="none" stroke="url(#linkGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#arrowShadow)" />

    <!-- Tête de flèche pointant directement sur name="zone_cours" -->
    <path d="M 488,84 L 507,93 L 488,102 L 492,93 Z" fill="#10b981" stroke="#047857" stroke-width="1.2" stroke-linejoin="round" filter="url(#arrowShadow)" />

    <!-- Badge central de correspondance -->
    <g transform="translate(402, 74)">
      <rect x="0" y="0" width="76" height="62" rx="7" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8" filter="url(#arrowShadow)" />
      <text x="38" y="16" font-size="11" text-anchor="middle">🔗</text>
      <text x="38" y="31" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">target</text>
      <text x="38" y="42" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#d97706" text-anchor="middle">===</text>
      <text x="38" y="53" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#047857" text-anchor="middle">name</text>

      <rect x="-3" y="64" width="82" height="20" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1" filter="url(#arrowShadow)" />
      <text x="38" y="78" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#065f46" text-anchor="middle">✓ IDENTIQUE</text>
    </g>
  </g>
</svg>
