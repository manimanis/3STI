<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Exercice 6 — Mini-projet Inscription à un club">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="760" height="270" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/><rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 6 — Mini-projet : Inscription à un club (&lt;div id="bilan"&gt;)</text>

  <!-- Cas Erreur -->
  <rect x="16" y="52" width="354" height="202" rx="9" fill="#2c1518" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="16" y="52" width="354" height="26" rx="9" fill="#b91c1c"/><rect x="16" y="66" width="354" height="12" fill="#b91c1c"/>
  <text x="193" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">CAS 1 : ERREURS CUMULÉES (3 if indépendants)</text>
  <text x="30" y="100" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="12">Entrées : nom = "", âge = 25, règlement non coché</text>
  <rect x="30" y="114" width="326" height="120" rx="6" fill="#fdecec" stroke="#ef4444"/>
  <text x="42" y="140" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Le nom est vide.</text>
  <text x="42" y="166" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">L'âge doit être entre 11 et 19 ans.</text>
  <text x="42" y="192" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Le règlement n'est pas accepté.</text>

  <!-- Cas Valide -->
  <rect x="390" y="52" width="354" height="202" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="390" y="52" width="354" height="26" rx="9" fill="#059669"/><rect x="390" y="66" width="354" height="12" fill="#059669"/>
  <text x="567" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">CAS 2 : INSCRIPTION VALIDE (Lina, 13 ans)</text>
  <text x="404" y="100" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12">Échecs, Débutant, règlement coché (16 ans → Senior)</text>
  <rect x="404" y="114" width="326" height="128" rx="6" fill="#e9f7ee" stroke="#10b981"/>
  <text x="416" y="136" fill="#065f46" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Inscription enregistrée.</text>
  <text x="416" y="156" fill="#065f46" font-family="Segoe UI, sans-serif" font-size="12.5">Nom : Lina</text>
  <text x="416" y="176" fill="#065f46" font-family="Segoe UI, sans-serif" font-size="12.5">Âge : 13 ans.</text>
  <text x="416" y="196" fill="#065f46" font-family="Segoe UI, sans-serif" font-size="12.5">Activité : Échecs  |  Niveau : Débutant</text>
  <text x="416" y="218" fill="#065f46" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Groupe : Junior</text>
</svg>