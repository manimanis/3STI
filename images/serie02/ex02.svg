<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" width="760" height="245" role="img" aria-label="Exercice 2 — Formulaire nom et date de naissance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="760" height="245" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/><rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 2 — Nom et date de naissance (test en fin novembre 2026)</text>

  <rect x="16" y="52" width="290" height="176" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="16" y="52" width="290" height="26" rx="9" fill="#1d4ed8"/><rect x="16" y="66" width="290" height="12" fill="#1d4ed8"/>
  <text x="161" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">SAISIE (&lt;form&gt;)</text>

  <rect x="30" y="92" width="262" height="30" rx="5" fill="#0f172a" stroke="#60a5fa"/>
  <text x="40" y="112" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">nom : "Lina"</text>
  <rect x="30" y="132" width="262" height="30" rx="5" fill="#0f172a" stroke="#60a5fa"/>
  <text x="40" y="152" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">naissance : 2013-03-15</text>
  <rect x="30" y="178" width="110" height="30" rx="6" fill="#4f46e5"/>
  <text x="85" y="197" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Présenter</text>

  <line x1="312" y1="140" x2="352" y2="140" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="52" width="384" height="176" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="360" y="52" width="384" height="26" rx="9" fill="#059669"/><rect x="360" y="66" width="384" height="12" fill="#059669"/>
  <text x="552" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">&lt;div id="presentation"&gt; (innerHTML + &lt;br&gt;)</text>

  <rect x="376" y="90" width="352" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="388" y="112" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="13">Bonjour, je m'appelle Lina et j'ai 13 ans.</text>
  <text x="388" y="134" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="13">L'an prochain, j'aurai 14 ans.</text>
  <text x="388" y="156" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Je suis mineur.</text>

  <text x="376" y="194" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="11.5">Si nom ou date vide (rouge) :</text>
  <text x="376" y="212" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Écrivez votre nom et votre date de naissance.</text>
