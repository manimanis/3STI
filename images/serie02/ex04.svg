<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 225" width="760" height="225" role="img" aria-label="Exercice 4 — Convertisseur avec liste déroulante">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="760" height="225" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/><rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 4 — Convertisseur avec liste déroulante (1 euro = 3,4 dinars)</text>

  <rect x="16" y="52" width="290" height="156" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="30" y="80" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">FORMULAIRE (&lt;select id="sens"&gt;)</text>
  <rect x="30" y="92" width="262" height="28" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="40" y="111" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">montant : 100  (ou 50)</text>
  <rect x="30" y="128" width="262" height="28" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="40" y="147" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12.5">Dinars vers Euros ("dt-eur")  ▼</text>
  <rect x="30" y="166" width="100" height="28" rx="6" fill="#4f46e5"/><text x="80" y="185" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Convertir</text>

  <line x1="312" y1="130" x2="352" y2="130" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="360" y="52" width="384" height="156" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="376" y="80" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">RÉSULTAT TRONQUÉ DANS &lt;div id="conv"&gt;</text>

  <rect x="376" y="92" width="352" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="552" y="117" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">100 dinars = 29 euros.</text>

  <rect x="376" y="144" width="352" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="552" y="169" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">50 euros = 170 dinars.</text>
</svg>