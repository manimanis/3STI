<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Exercice 5 — Générer une table de multiplication dans un div">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="760" height="250" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/><rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 5 — Générer une table de multiplication dans &lt;div id="table"&gt;</text>

  <rect x="16" y="52" width="230" height="182" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="30" y="80" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">SAISIE (1 à 20)</text>
  <rect x="30" y="94" width="202" height="30" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="42" y="114" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">base : 7  (ou 25)</text>
  <rect x="30" y="138" width="100" height="28" rx="6" fill="#4f46e5"/><text x="80" y="156" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Générer</text>
  <text x="30" y="192" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">Boucle for (i = 1 à 10)</text>
  <text x="30" y="210" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11.5">Balises &lt;b&gt; et &lt;br&gt;</text>

  <line x1="252" y1="143" x2="292" y2="143" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="300" y="52" width="205" height="182" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="314" y="76" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Si base = 7 (valide)</text>
  <rect x="314" y="86" width="177" height="136" rx="6" fill="#f8fafc"/>
  <text x="326" y="106" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Table de 7</text>
  <text x="326" y="126" fill="#0f172a" font-family="Consolas, monospace" font-size="12.5">7 x 1 = 7</text>
  <text x="326" y="144" fill="#0f172a" font-family="Consolas, monospace" font-size="12.5">7 x 2 = 14</text>
  <text x="326" y="162" fill="#475569" font-family="Consolas, monospace" font-size="12.5">...</text>
  <text x="326" y="182" fill="#0f172a" font-family="Consolas, monospace" font-size="12.5">7 x 9 = 63</text>
  <text x="326" y="200" fill="#0f172a" font-family="Consolas, monospace" font-size="12.5">7 x 10 = 70</text>

  <rect x="518" y="52" width="226" height="182" rx="9" fill="#2c1518" stroke="#ef4444" stroke-width="1.5"/>
  <text x="532" y="76" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Si base = 25 (hors bornes)</text>
  <rect x="532" y="102" width="198" height="62" rx="6" fill="#f8fafc"/>
  <text x="542" y="128" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Choisissez un nombre</text>
  <text x="542" y="148" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">entre 1 et 20.</text>
</svg>