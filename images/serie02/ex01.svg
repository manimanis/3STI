<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Exercice 1 — Calculatrice à boutons radio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/></marker>
  </defs>
  <rect width="760" height="250" rx="12" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="38" rx="12" fill="#1e1b4b"/><rect x="0" y="24" width="760" height="14" fill="#1e1b4b"/>
  <text x="18" y="24" fill="#c7d2fe" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">Exercice 1 — La calculatrice à boutons radio (&lt;form&gt; → &lt;div id="resultat"&gt;)</text>

  <!-- Form Mockup -->
  <rect x="16" y="52" width="330" height="182" rx="9" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="16" y="52" width="330" height="26" rx="9" fill="#1d4ed8"/><rect x="16" y="66" width="330" height="12" fill="#1d4ed8"/>
  <text x="181" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700">FORMULAIRE (&lt;form&gt;)</text>

  <rect x="30" y="92" width="140" height="28" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="40" y="111" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">n1 : 17</text>
  <rect x="186" y="92" width="140" height="28" rx="5" fill="#0f172a" stroke="#60a5fa"/><text x="196" y="111" fill="#fbbf24" font-family="Consolas, monospace" font-size="13">n2 : 5  (ou 0)</text>

  <circle cx="42" cy="142" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/><circle cx="42" cy="142" r="2.5" fill="#ffffff"/>
  <text x="54" y="146" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12">Addition (+)</text>
  <circle cx="152" cy="142" r="6" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="164" y="146" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Soustraction (-)</text>
  <circle cx="42" cy="168" r="6" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="54" y="172" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Multiplication (*)</text>
  <circle cx="152" cy="168" r="6" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="164" y="172" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Division (/)</text>

  <rect x="30" y="190" width="110" height="30" rx="6" fill="#4f46e5"/><text x="85" y="209" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Calculer</text>

  <line x1="352" y1="143" x2="394" y2="143" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Output Divs -->
  <rect x="402" y="52" width="342" height="182" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="402" y="52" width="342" height="26" rx="9" fill="#059669"/><rect x="402" y="66" width="342" height="12" fill="#059669"/>
  <text x="573" y="70" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">AFFICHAGE DANS &lt;div id="resultat"&gt;</text>

  <rect x="418" y="92" width="310" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="430" y="119" fill="#0f172a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">17 + 5 = 22  (gras, fond bleu clair)</text>

  <text x="418" y="158" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Si op == "/" et n2 == 0 :</text>
  <rect x="418" y="168" width="310" height="44" rx="6" fill="#fdecec" stroke="#ef4444"/>
  <text x="430" y="195" fill="#dc2626" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Division par zéro impossible.</text>
</svg>