<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" width="100%" height="100%">
  <defs>
    <!-- Ombre douce pour le conteneur principal -->
    <filter id="cardShadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>

    <!-- Ombre pour les badges -->
    <filter id="badgeShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Fond global de la carte -->
  <rect x="10" y="8" width="860" height="372" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- Barre d'en-tête façon fenêtre de navigateur -->
  <path d="M 10 20 A 12 12 0 0 1 22 8 L 858 8 A 12 12 0 0 1 870 20 L 870 38 L 10 38 Z" fill="#f8fafc" />
  <line x1="10" y1="38" x2="870" y2="38" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="30" cy="23" r="4" fill="#f87171" />
  <circle cx="46" cy="23" r="4" fill="#fbbf24" />
  <circle cx="62" cy="23" r="4" fill="#34d399" />

  <text x="84" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#1e293b">
    ⚡ Ordre d'évaluation des balises &lt;source&gt; dans &lt;picture&gt; (Règle du premier match)
  </text>

  <!-- Badge d'indication de parcours -->
  <rect x="656" y="12" width="202" height="22" rx="11" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
  <text x="757" y="27" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">
    Évaluation de haut en bas ↓
  </text>

  <!-- =====================================================================
       1. PANNEAU GAUCHE : ORDRE DÉCROISSANT (CORRECT)
       ===================================================================== -->
  <g id="panneau-gauche" transform="translate(24, 50)">
    <!-- Cadre extérieur -->
    <rect x="0" y="0" width="406" height="318" rx="8" fill="#f8fafc" stroke="#a7f3d0" stroke-width="1.4" />

    <!-- Badge En-tête -->
    <rect x="14" y="-11" width="230" height="22" rx="4" fill="#059669" filter="url(#badgeShadow)" />
    <text x="129" y="4.5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      ✅ 1. ORDRE DÉCROISSANT (Correct)
    </text>

    <!-- Sous-titre -->
    <text x="14" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#334155">
      Du plus grand au plus petit : 1024px puis 768px
    </text>

    <!-- Étape 1 : min-width 1024px -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="242" height="56" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#e2e8f0">
        <tspan x="8" y="24" fill="#94a3b8">&lt;</tspan><tspan fill="#34d399">source</tspan> <tspan fill="#38bdf8">media</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#fde047">"(min-width: 1024px)"</tspan>
        <tspan x="18" y="44" fill="#a78bfa">srcset</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"desktop.jpg"</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>

      <rect x="250" y="0" width="138" height="56" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#065f46" x="319" y="19" text-anchor="middle">
        🖥️ Écran 1200px
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#059669" x="319" y="34" text-anchor="middle">
        1200 ≥ 1024 (VRAI)
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#047857" x="319" y="47" text-anchor="middle">
        ✓ Desktop affiché
      </text>
    </g>

    <!-- Flèche intermédiaire 1 -->
    <g transform="translate(131, 98)">
      <line x1="0" y1="2" x2="0" y2="16" stroke="#10b981" stroke-width="2" />
      <polygon points="-3,14 3,14 0,19" fill="#10b981" />
      <text x="14" y="13" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#059669">si &lt; 1024px</text>
    </g>

    <!-- Étape 2 : min-width 768px -->
    <g transform="translate(10, 122)">
      <rect x="0" y="0" width="242" height="56" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#e2e8f0">
        <tspan x="8" y="24" fill="#94a3b8">&lt;</tspan><tspan fill="#34d399">source</tspan> <tspan fill="#38bdf8">media</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#fde047">"(min-width: 768px)"</tspan>
        <tspan x="18" y="44" fill="#a78bfa">srcset</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"tablet.jpg"</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>

      <rect x="250" y="0" width="138" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#1e40af" x="319" y="19" text-anchor="middle">
        📱 Écran 850px
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#2563eb" x="319" y="34" text-anchor="middle">
        850 ≥ 768 (VRAI)
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#1d4ed8" x="319" y="47" text-anchor="middle">
        ✓ Tablette affichée
      </text>
    </g>

    <!-- Flèche intermédiaire 2 -->
    <g transform="translate(131, 178)">
      <line x1="0" y1="2" x2="0" y2="16" stroke="#10b981" stroke-width="2" />
      <polygon points="-3,14 3,14 0,19" fill="#10b981" />
      <text x="14" y="13" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#059669">si &lt; 768px</text>
    </g>

    <!-- Étape 3 : Balise <img> de repli -->
    <g transform="translate(10, 202)">
      <rect x="0" y="0" width="242" height="48" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#e2e8f0">
        <tspan x="8" y="29" fill="#94a3b8">&lt;</tspan><tspan fill="#f87171">img</tspan> <tspan fill="#a78bfa">src</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"mobile.jpg"</tspan> <tspan fill="#38bdf8">alt</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"..."</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>

      <rect x="250" y="0" width="138" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#92400e" x="319" y="20" text-anchor="middle">
        📲 Écran &lt; 768px
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b45309" x="319" y="35" text-anchor="middle">
        ✓ Mobile par défaut
      </text>
    </g>

    <!-- Verdict bas -->
    <rect x="10" y="268" width="386" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2" />
    <text x="203" y="291" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">
      🏆 Résultat : Chaque résolution reçoit l'image parfaite !
    </text>
  </g>

  <!-- =====================================================================
       2. PANNEAU DROIT : ORDRE CROISSANT (PIÈGE À ÉVITER)
       ===================================================================== -->
  <g id="panneau-droit" transform="translate(450, 50)">
    <!-- Cadre extérieur -->
    <rect x="0" y="0" width="406" height="318" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4" />

    <!-- Badge En-tête -->
    <rect x="14" y="-11" width="245" height="22" rx="4" fill="#dc2626" filter="url(#badgeShadow)" />
    <text x="136" y="4.5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      ❌ 2. PIÈGE CLASSIQUE : Ordre croissant
    </text>

    <!-- Sous-titre -->
    <text x="14" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#991b1b">
      Du plus petit au plus grand : 768px avant 1024px (FAUX)
    </text>

    <!-- Étape 1 : min-width 768px en premier (capture tout) -->
    <g transform="translate(10, 42)">
      <rect x="0" y="0" width="242" height="56" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#e2e8f0">
        <tspan x="8" y="24" fill="#94a3b8">&lt;</tspan><tspan fill="#f87171">source</tspan> <tspan fill="#38bdf8">media</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#f87171" font-weight="bold">"(min-width: 768px)"</tspan>
        <tspan x="18" y="44" fill="#a78bfa">srcset</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"tablet.jpg"</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>

      <rect x="250" y="0" width="138" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#991b1b" x="319" y="19" text-anchor="middle">
        ⚠️ Écran 1200px
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c" x="319" y="34" text-anchor="middle">
        1200 ≥ 768 (VRAI !)
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="800" fill="#7f1d1d" x="319" y="47" text-anchor="middle">
        ➔ Tablette sur PC !
      </text>
    </g>

    <!-- Flèche barrée 1 -->
    <g transform="translate(131, 98)">
      <line x1="0" y1="2" x2="0" y2="16" stroke="#ef4444" stroke-width="2" />
      <polygon points="-3,14 3,14 0,19" fill="#ef4444" />
      <text x="14" y="13" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Arrêt immédiat !</text>
    </g>

    <!-- Étape 2 : min-width 1024px (Code mort, jamais exécuté) -->
    <g transform="translate(10, 122)">
      <rect x="0" y="0" width="242" height="56" rx="6" fill="#1e1e24" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,2" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#64748b">
        <tspan x="8" y="24">&lt;source media="(min-width: 1024px)"</tspan>
        <tspan x="18" y="44">srcset="desktop.jpg"&gt;</tspan>
      </text>
      <!-- Ligne rouge de biffure -->
      <line x1="6" y1="30" x2="236" y2="30" stroke="#ef4444" stroke-width="2" />

      <rect x="250" y="0" width="138" height="56" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#fca5a5" x="319" y="23" text-anchor="middle">
        🚫 CODE MORT
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#fecaca" x="319" y="40" text-anchor="middle">
        JAMAIS ATTEINT !
      </text>
    </g>

    <!-- Flèche 2 -->
    <g transform="translate(131, 178)">
      <line x1="0" y1="2" x2="0" y2="16" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2,2" />
      <polygon points="-3,14 3,14 0,19" fill="#94a3b8" />
    </g>

    <!-- Étape 3 : Balise <img> de repli -->
    <g transform="translate(10, 202)">
      <rect x="0" y="0" width="242" height="48" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text font-family="'Consolas', monospace" font-size="11.5" fill="#e2e8f0">
        <tspan x="8" y="29" fill="#94a3b8">&lt;</tspan><tspan fill="#f87171">img</tspan> <tspan fill="#a78bfa">src</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"mobile.jpg"</tspan> <tspan fill="#38bdf8">alt</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#facc15">"..."</tspan><tspan fill="#94a3b8">&gt;</tspan>
      </text>

      <rect x="250" y="0" width="138" height="48" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2" />
      <text font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#92400e" x="319" y="20" text-anchor="middle">
        📲 Écran &lt; 768px
      </text>
      <text font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#b45309" x="319" y="35" text-anchor="middle">
        ✓ Mobile par défaut
      </text>
    </g>

    <!-- Verdict bas -->
    <rect x="10" y="268" width="386" height="36" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" />
    <text x="203" y="291" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">
      💥 Problème : La version Desktop n'est JAMAIS affichée !
    </text>
  </g>
</svg>
