<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="floatLShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="gapArrowL" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
    <marker id="gapArrowR" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#floatLShadow)" />

  <!-- Code header -->
  <rect x="30" y="20" width="180" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="40" y="37" font-family="monospace" font-weight="700" font-size="12" fill="#4f46e5">img { float: left; }</text>

  <!-- Solution Highlight Badge -->
  <rect x="220" y="20" width="290" height="26" rx="5" fill="#ffedd5" stroke="#fb923c" />
  <text x="365" y="37" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#c2410c" text-anchor="middle">
    Solution : ajouter un <tspan font-family="monospace" font-weight="bold">margin-right</tspan> à l'image
  </text>

  <!-- Content area -->
  <g transform="translate(30, 58)">
    <!-- Floated Image on left -->
    <rect x="0" y="0" width="140" height="90" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" />
    <circle cx="40" cy="32" r="14" fill="#818cf8" />
    <path d="M 12 75 L 50 42 L 88 70 L 110 52 L 130 75 Z" fill="#4f46e5" opacity="0.8" />
    <rect x="12" y="62" width="116" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <text x="70" y="76" font-family="monospace" font-weight="700" font-size="10" fill="#4338ca" text-anchor="middle">&lt;img&gt; à gauche</text>

    <!-- GAP HIGHLIGHT (MARGIN-RIGHT) -->
    <rect x="142" y="0" width="40" height="90" fill="#fed7aa" fill-opacity="0.6" stroke="#ea580c" stroke-dasharray="3,3" />
    <line x1="145" y1="45" x2="179" y2="45" stroke="#ea580c" stroke-width="2" marker-start="url(#gapArrowL)" marker-end="url(#gapArrowR)" />
    <rect x="144" y="52" width="36" height="16" rx="3" fill="#ea580c" />
    <text x="162" y="64" font-family="monospace" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">marge</text>

    <!-- Text wrapping on the right -->
    <g transform="translate(195, 0)">
      <rect x="0" y="5" width="285" height="9" rx="3" fill="#64748b" />
      <rect x="0" y="23" width="270" height="9" rx="3" fill="#94a3b8" />
      <rect x="0" y="41" width="280" height="9" rx="3" fill="#94a3b8" />
      <rect x="0" y="59" width="260" height="9" rx="3" fill="#94a3b8" />
      <rect x="0" y="77" width="275" height="9" rx="3" fill="#94a3b8" />
    </g>

    <!-- Text continuing below -->
    <rect x="0" y="100" width="480" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="118" width="460" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="136" width="320" height="9" rx="3" fill="#cbd5e1" />
  </g>
</svg>
