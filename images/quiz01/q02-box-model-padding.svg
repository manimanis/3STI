<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
    <marker id="arrowRev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="8" width="520" height="204" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#boxShadow)" />

  <!-- MARGIN (Layer 4) -->
  <rect x="25" y="20" width="490" height="180" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="35" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">MARGIN (Marge externe)</text>

  <!-- BORDER (Layer 3) -->
  <rect x="65" y="44" width="410" height="136" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" />
  <text x="75" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a16207">BORDER (Bordure)</text>

  <!-- PADDING (Layer 2 - HIGHLIGHTED) -->
  <rect x="105" y="68" width="330" height="94" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text x="115" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803d">? (Espace intérieur recherché)</text>

  <!-- CONTENT (Layer 1) -->
  <rect x="155" y="94" width="230" height="52" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text x="270" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">CONTENU (Texte / Image)</text>
  <text x="270" y="137" font-family="monospace" font-size="10" fill="#0284c7" text-anchor="middle">width × height</text>

  <!-- Visual Measurement Indicator between Content and Border -->
  <line x1="155" y1="120" x2="108" y2="120" stroke="#15803d" stroke-width="2" marker-end="url(#arrowRev)" />
  <line x1="385" y1="120" x2="432" y2="120" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Label Badge Callout -->
  <g transform="translate(350, 24)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="#16a34a" />
    <text x="77" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Écart Contenu ↔ Bordure</text>
  </g>
</svg>
