<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser window frame -->
  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Browser top bar -->
  <path d="M 15 20 A 10 10 0 0 1 25 10 L 515 10 A 10 10 0 0 1 525 20 L 525 38 L 15 38 Z" fill="#f1f5f9" />
  <circle cx="32" cy="24" r="4" fill="#f87171" />
  <circle cx="44" cy="24" r="4" fill="#fbbf24" />
  <circle cx="56" cy="24" r="4" fill="#34d399" />
  <rect x="75" y="17" width="220" height="14" rx="4" fill="#ffffff" stroke="#e2e8f0" />
  <text x="85" y="27" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">https://monsite.com</text>

  <!-- Header section -->
  <rect x="30" y="48" width="480" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="45" cy="61" r="7" fill="#6366f1" opacity="0.8" />
  <rect x="58" y="57" width="60" height="8" rx="2" fill="#64748b" />
  <text x="440" y="64" font-family="monospace" font-size="9" fill="#94a3b8">&lt;header&gt;</text>

  <!-- Navigation bar (HIGHLIGHTED) -->
  <rect x="30" y="80" width="480" height="38" rx="7" fill="url(#navGrad)" stroke="#4338ca" stroke-width="1.5" />
  
  <!-- Nav tag badge -->
  <rect x="42" y="87" width="56" height="24" rx="5" fill="#ffffff" />
  <text x="70" y="103" font-family="monospace" font-weight="700" font-size="12" fill="#4f46e5" text-anchor="middle">&lt;nav&gt;</text>

  <!-- Navigation Links -->
  <g transform="translate(125, 87)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <text x="35" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Accueil</text>

    <rect x="80" y="0" width="70" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <text x="115" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Cours</text>

    <rect x="160" y="0" width="70" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <text x="195" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Activités</text>

    <rect x="240" y="0" width="70" height="24" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <text x="275" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Contact</text>
  </g>

  <!-- Callout indicator -->
  <text x="495" y="103" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="end">Liens principaux</text>

  <!-- Main & Content area mockup -->
  <rect x="30" y="125" width="330" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
  <rect x="42" y="135" width="120" height="8" rx="2" fill="#cbd5e1" />
  <rect x="42" y="149" width="280" height="6" rx="2" fill="#e2e8f0" />
  <rect x="42" y="160" width="240" height="6" rx="2" fill="#e2e8f0" />

  <!-- Aside preview -->
  <rect x="370" y="125" width="140" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0" />
  <rect x="382" y="135" width="60" height="8" rx="2" fill="#cbd5e1" />
  <rect x="382" y="149" width="115" height="6" rx="2" fill="#e2e8f0" />

  <!-- Footer preview -->
  <rect x="30" y="183" width="480" height="18" rx="4" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="270" y="195" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">&lt;footer&gt; © 2026 - Liens secondaires &amp; mentions &lt;/footer&gt;</text>
</svg>
