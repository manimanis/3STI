<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="layerShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="outArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="8" width="520" height="204" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#layerShadow)" />

  <!-- 4. MARGIN (Extérieur) -->
  <rect x="25" y="20" width="490" height="180" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="2" stroke-dasharray="5,4" />
  <g transform="translate(35, 36)">
    <circle cx="8" cy="-4" r="9" fill="#ea580c" />
    <text x="8" y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="24" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a3412">MARGIN (Marge externe)</text>
  </g>

  <!-- 3. BORDER -->
  <rect x="65" y="46" width="410" height="130" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="2.5" />
  <g transform="translate(75, 62)">
    <circle cx="8" cy="-4" r="9" fill="#ca8a04" />
    <text x="8" y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="24" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#854d0e">BORDER (Bordure)</text>
  </g>

  <!-- 2. PADDING -->
  <rect x="105" y="72" width="330" height="84" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <g transform="translate(115, 88)">
    <circle cx="8" cy="-4" r="9" fill="#16a34a" />
    <text x="8" y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="24" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d">PADDING (Marge interne)</text>
  </g>

  <!-- 1. CONTENT (Centre) -->
  <rect x="155" y="98" width="230" height="42" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <g transform="translate(270, 122)">
    <circle cx="-65" cy="-2" r="9" fill="#0284c7" />
    <text x="-65" y="2" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
    <text x="-48" y="2" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0369a1">CONTENU (Centre)</text>
  </g>

  <!-- Outward arrow -->
  <line x1="385" y1="119" x2="495" y2="119" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#outArrow)" />
  <rect x="400" y="96" width="90" height="18" rx="4" fill="#4f46e5" />
  <text x="445" y="109" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Vers l'extérieur ➔</text>
</svg>
