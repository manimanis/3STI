<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="footShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Browser window frame -->
  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#footShadow)" />

  <!-- Window bar -->
  <rect x="15" y="10" width="510" height="24" rx="10" fill="#f1f5f9" />
  <circle cx="30" cy="22" r="3.5" fill="#f87171" />
  <circle cx="42" cy="22" r="3.5" fill="#fbbf24" />
  <circle cx="54" cy="22" r="3.5" fill="#34d399" />
  <text x="270" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Structure d'une page Web</text>

  <!-- Header -->
  <rect x="30" y="42" width="480" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="45" y="57" font-family="monospace" font-size="10" fill="#94a3b8">&lt;header&gt; &amp; &lt;nav&gt;</text>

  <!-- Main area (muted) -->
  <rect x="30" y="70" width="480" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="45" y="86" font-family="monospace" font-size="10" fill="#94a3b8">&lt;main&gt; Contenu principal de la page</text>
  <rect x="45" y="96" width="340" height="6" rx="2" fill="#e2e8f0" />
  <rect x="45" y="108" width="280" height="6" rx="2" fill="#e2e8f0" />
  <rect x="45" y="120" width="310" height="6" rx="2" fill="#e2e8f0" />

  <!-- FOOTER (BOTTOM - HIGHLIGHTED) -->
  <rect x="30" y="144" width="480" height="54" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="2" />
  
  <!-- Footer Tag Badge -->
  <rect x="40" y="152" width="80" height="22" rx="4" fill="#4f46e5" />
  <text x="80" y="167" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">&lt;footer&gt;</text>

  <!-- Explanation -->
  <text x="135" y="167" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1e293b">Pied de page : Droits d'auteur &amp; Liens</text>
  <text x="40" y="187" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">
    © 2026 Tous droits réservés • Mentions légales • Contact • Plan du site
  </text>

  <rect x="420" y="152" width="80" height="22" rx="11" fill="#e0e7ff" />
  <text x="460" y="167" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4338ca" text-anchor="middle">Bas de page</text>
</svg>
