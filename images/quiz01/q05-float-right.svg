<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <filter id="floatShadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
    <marker id="floatArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="15" y="10" width="510" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#floatShadow)" />

  <!-- Code banner -->
  <rect x="30" y="22" width="220" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0" />
  <text x="40" y="39" font-family="monospace" font-weight="700" font-size="12" fill="#4f46e5">img { float: right; }</text>

  <!-- Explanation pill -->
  <rect x="265" y="22" width="245" height="26" rx="5" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="387" y="39" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3730a3" text-anchor="middle">Habillage du texte à gauche de l'image</text>

  <!-- Paragraph representation -->
  <g transform="translate(30, 60)">
    <!-- Text lines wrapping to the left of the image -->
    <rect x="0" y="5" width="290" height="9" rx="3" fill="#64748b" />
    <rect x="0" y="23" width="280" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="41" width="295" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="59" width="270" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="77" width="285" height="9" rx="3" fill="#94a3b8" />

    <!-- Floated Image on the right -->
    <g transform="translate(315, 0)">
      <rect x="0" y="0" width="165" height="92" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" />
      <circle cx="45" cy="35" r="14" fill="#818cf8" />
      <path d="M 15 80 L 60 45 L 105 75 L 130 55 L 155 80 Z" fill="#4f46e5" opacity="0.8" />
      <rect x="15" y="65" width="135" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" />
      <text x="82" y="79" font-family="monospace" font-weight="700" font-size="11" fill="#4338ca" text-anchor="middle">&lt;img&gt; à droite</text>
    </g>

    <!-- Text lines continuing underneath the floated image -->
    <rect x="0" y="102" width="480" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="120" width="460" height="9" rx="3" fill="#94a3b8" />
    <rect x="0" y="138" width="340" height="9" rx="3" fill="#cbd5e1" />
  </g>
</svg>
